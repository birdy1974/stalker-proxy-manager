[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests

# Run over all cores (pytest-xdist). Each worker is its own process with its own
# temp database, so they cannot collide; `-n 0` runs in-process (needed for
# --pdb), `-n 2` limits it. The suite is ~3x faster than a serial run made
# before this, of which roughly 40 s was per-test schema DDL that now happens
# only when a test actually changed the schema (see tests/conftest.py).
addopts = -n auto

# A hang must FAIL, never hold the run hostage. This is a safety net, not a
# performance knob: the slowest test in the suite is under 1.5 s and nothing
# legitimate comes near this limit, so tripping it means a deadlock (a portal
# session that never answers, a subprocess reap that blocks) - exactly the
# failure mode that used to need a manual Ctrl-C and a bisect. Tune per run
# with `--timeout=30`, or disable with `--timeout=0`.
timeout = 120
# POSIX signal method: interrupts the running test (and its event loop) in
# place, so the report names the test and pytest's remaining output survives.
timeout_method = signal
