# Build + push the all-in-one image to GHCR - but ONLY after CI passed.
#
# Deployment gate (test before deploy):
#   * pushes to main/master do NOT build directly any more. They trigger the
#     ci workflow (static + runtime selftests + image smoke test); when it
#     finishes successfully on the default branch, THIS workflow runs via
#     `workflow_run` and publishes the image from the exact commit CI tested.
#   * release tags ("v*") publish directly - they are cut from already
#     tested main commits.
#   * workflow_dispatch stays available as a manual escape hatch.
#
# A failing ci run therefore blocks the GHCR image from being updated, so
# `docker compose up -d --pull` / Container Manager can never pull a broken
# build into the real environment.
name: docker

on:
  push:
    tags: ["v*"]
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: docker-publish
  cancel-in-progress: true

jobs:
  build:
    # Only publish when: manual/tag run, or the ci workflow succeeded for
    # exactly this commit (guard also skips stale completions after back-to-
    # back pushes, where a newer commit is already on the default branch).
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_sha == github.sha)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run fires on the default branch - check out the exact
          # commit the ci workflow tested, not whatever is HEAD right now
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "Image metadata (tags: latest, sha, semver releases)"
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # DS918+ is x86_64 only; arm64 can be added later without code changes.
      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Boot smoke test: run the image with the built-in mock portal and verify
  # that the GUI answers, the mock portal handshake works and the app booted
  # cleanly. All the logic lives in dev/smoke.sh (verbose, self-diagnosing,
  # and it cleans up after itself) - keep it there, not inline: an inline
  # `docker logs | grep -q` is exactly the trap that made this job fail for
  # six runs (see the script header for why it merges the log streams).
  smoke:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Build (local)
        run: docker build -t spm-smoke .
      - name: Run with mock portal + hit health routes
        run: bash dev/smoke.sh
        env:
          SPM_SMOKE_IMAGE: spm-smoke
        run: bash dev/smoke.sh
