# ============================================================================
# CI - test the application BEFORE anything is deployed
#
# Runs on every PR, every push to main/master (and release tags). The deploy
# workflow (docker-publish.yml) is triggered by THIS workflow's success via
# `workflow_run`, so an image that failed any of these jobs can never reach
# GHCR - and therefore never reach the NAS / real environment.
#
# Jobs:
#   static   syntax, app import, dependency consistency, YAML + compose checks
#   runtime  boots the real app (uvicorn) and exercises the HTTP surface end
#            to end via dev/selftest.py - against SQLite AND the Postgres
#            reference deployment (matrix), mock portal included
#   docker   builds the all-in-one image and runs the boot smoke test
#            (dev/smoke.sh) against it - same script as the deploy workflow
# ============================================================================
name: ci

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Byte-compile every module (syntax errors fail fast)
        run: python -m compileall -q app

      - name: Import the app (catches import-time breakage)
        run: python -c "import app.main; print('app imports OK')"
        env:
          SPM_DATA_DIR: /tmp/spm-import

      - name: Dependency consistency
        run: pip check

      - name: Workflow + compose YAML parse check (incl. example drift)
        run: bash dev/check-yaml.sh

      - name: Validate docker-compose.yml
        run: docker compose config -q
        env:
          SPM_ADMIN_PASSWORD: ci

  runtime:
    name: runtime selftest (${{ matrix.database }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: static
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      # started for both legs (cheap); only the postgres leg connects to it
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: stalker_proxy_manager
          POSTGRES_USER: spm
          POSTGRES_PASSWORD: spm
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U spm -d stalker_proxy_manager"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Boot the app and run the API selftest (dev/selftest.py)
        run: |
          if [ "${{ matrix.database }}" = "postgres" ]; then
            export SPM_DATABASE_URL="postgresql+asyncpg://spm:spm@127.0.0.1:5432/stalker_proxy_manager"
          fi
          python dev/selftest.py
        env:
          SPM_SELFTEST_LABEL: ${{ matrix.database }}

  docker:
    name: docker image boot smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: static
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the all-in-one image (cached)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: spm-smoke:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run with mock portal + hit health routes
        run: bash dev/smoke.sh
        env:
          SPM_SMOKE_IMAGE: spm-smoke
