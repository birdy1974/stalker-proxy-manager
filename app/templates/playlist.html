{% extends "base.html" %}
{% block content %}
<div class="card">
  <div class="card-header pb-0">
    <ul class="nav nav-tabs card-header-tabs nav-subtabs" id="pl-tabs">
      <li class="nav-item"><a class="nav-link active" data-tab="live"><i class="bi bi-tv"></i> Live</a></li>
      <li class="nav-item"><a class="nav-link" data-tab="vod"><i class="bi bi-film"></i> VOD</a></li>
      <li class="nav-item"><a class="nav-link" data-tab="series"><i class="bi bi-collection"></i> Series</a></li>
      <li class="nav-item"><a class="nav-link" data-tab="local"><i class="bi bi-folder2-open"></i> Local files</a></li>
    </ul>
  </div>
  <div class="card-body p-2">
    <div id="pl-live"></div>
    <div id="pl-vod" class="d-none"></div>
    <div id="pl-series" class="d-none"></div>
    <div id="pl-local" class="d-none"></div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let TEMPLATES = [];
async function loadTemplates() {
  TEMPLATES = (await api("/api/ffmpeg")).items.filter(t => t.enabled);
}
const tplOptions = (selected) =>
  `<option value="">(default template)</option>` +
  TEMPLATES.map(t => `<option value="${t.id}" ${t.id === selected ? "selected" : ""}>${esc(t.name)}</option>`).join("");

/* inline template switch, directly in any playlist list row */
window.inlineTpl = async (kind, id, value, table) => {
  await api(`/api/playlist/${kind}/${id}`, { method: "PUT",
    body: { ffmpeg_template_id: +value || null } });
  toast("template updated", "ok");
  PL_TABLES[kind].reload();
};
const tplInlineCell = (kind, r) => `
  <select class="form-select form-select-sm" style="min-width:150px"
    onchange="event.stopPropagation();inlineTpl('${kind}', ${r.id}, this.value)">
    ${tplOptions(r.ffmpeg_template_id)}
  </select>`;

/* shortcuts shared by playlist tables */
const groupFilter = { type: "select", param: "group", placeholder: "group" };
const groupFilterLoader = { type: "select", param: "group", placeholder: "group",
  optionsLoader: (fill, t) => t.lastData?.groups && fill(t.lastData.groups.map(g => ({ v: g, l: g }))) };

function chainHtml(chain) {
  if (!chain.length) return '<span class="badge st-error">no source!</span>';
  return chain.map((c, i) => `
    <div class="small"><span class="badge ${i === 0 ? "text-bg-success" : "text-bg-secondary"}">${i + 1}</span>
      ${esc(c.name)} <span class="text-muted">@ ${esc(c.portal)}</span></div>`).join("");
}

const ALL_GROUPS = () => [...new Set(Object.values(PL_TABLES)
  .flatMap(t => t?.lastData?.groups || []))].sort();
const groupDialogHtml = (id, value, dlId) => `
  <input class="form-control form-control-sm" id="${id}" value="${esc(value || "")}" list="${dlId}" placeholder="type or pick a group…">
  <datalist id="${dlId}">${ALL_GROUPS().map(g => `<option value="${esc(g)}"></option>`).join("")}</datalist>`;

const PL_TABLES = {};
window.playTest = (id, kind) => playInModal(`/preview-play/${kind}/${id}.ts`, `${kind} #${id}`);

/* group picker: free text WITH dropdown suggestions (existing groups).
   Used inline in rows, in edit popups and in the bulk-assign dialog. */
const groupDatalist = (kind, dlId) =>
  `<datalist id="${dlId}">${((PL_TABLES[kind]?.lastData?.groups) || []).map(g => `<option value="${esc(g)}"></option>`).join("")}</datalist>`;
window.inlineGroup = async (kind, id, value) => {
  await api(`/api/playlist/${kind}/${id}`, { method: "PUT", body: { group_name: value.trim() } });
  toast("group updated", "ok");
  PL_TABLES[kind].reload();
};
function groupCell(kind, r) {
  const dlId = `dl-${kind}-${r.id}`;
  return `<input class="form-control form-control-sm" list="${dlId}" value="${esc(r.group_name || "")}"
    placeholder="group…" style="min-width:130px"
    onchange="event.stopPropagation();inlineGroup('${kind}', ${r.id}, this.value)">
    ${groupDatalist(kind, dlId)}`;
}

/* ========================= details popup (vod/series/local) =========================
 * Stored portal data instantly; stream probe (codec/resolution/bitrate, via
 * ffmpeg -- same mechanism as ffprobe) + TMDB enrichment load lazily after. */
const fmtSize = (b) => !b ? "?" : (b > 1073741824 ? (b / 1073741824).toFixed(1) + " GB" : (b / 1048576).toFixed(0) + " MB");
window.showDetails = (kind, row) => {
  const body = el("div");
  const info = {
    vod: `<h6>${esc(row.custom_name)} ${row.year ? `<span class="text-muted">(${esc(row.year)})</span>` : ""}
            ${row.rating ? `<span class="badge text-bg-warning">★ ${esc(row.rating)}</span>` : ""}</h6>
          <div class="small text-muted mb-2">VOD · group ${esc(row.group_name || "-")}</div>
          <p class="small">${esc(row.overview || "No description from portal.")}</p>`,
    series: `<h6>${esc(row.custom_name)} ${row.year ? `<span class="text-muted">(${esc(row.year)})</span>` : ""}
            ${row.rating ? `<span class="badge text-bg-warning">★ ${esc(row.rating)}</span>` : ""}</h6>
          <div class="small text-muted mb-2">Series · group ${esc(row.group_name || "-")} · ${row.enabled_episode_count} episodes in output</div>
          <p class="small">${esc(row.overview || "No description from portal.")}</p>
          <div class="muted-label mt-2">Seasons in output</div>
          <div>${(row.seasons || []).map(s => `<span class="badge ${s.enabled ? "st-online" : "st-unknown"} me-1">S${String(s.season_number).padStart(2, "0")}</span>`).join("") || "-"}</div>`,
    local: `<h6>${esc(row.custom_name || "(unnamed)")}</h6>
          <div class="small text-muted mb-2">Local file · group ${esc(row.group_name || "-")}</div>
          <table class="table table-sm mb-0" style="max-width:420px">
            <tr><td class="muted-label">File</td><td class="mono small">${esc(row.file)}</td></tr>
            <tr><td class="muted-label">Size</td><td>${fmtSize(row.size_bytes)}</td></tr>
            <tr><td class="muted-label">FFmpeg template</td><td>${esc(row.template || "(default)")}</td></tr>
          </table>`,
  }[kind];
  body.innerHTML = `
    <div class="d-flex gap-3">
      <div>${kind !== "local" && row.poster ? `<img src="${esc(row.poster)}" style="width:130px;border-radius:6px">` :
        `<div class="poster-thumb d-flex align-items-center justify-content-center" style="width:130px;height:180px">${kind === "local" ? "📄" : "🖼"}</div>`}</div>
      <div class="flex-grow-1">${info}
        <div class="muted-label mt-2">Stream info (probe)</div>
        <div class="probe-box"><span class="text-muted small">probing the ${kind === "local" ? "file" : "primary source stream"}…</span></div>
        <div class="muted-label mt-2">TMDB</div>
        <div class="tmdb-box"><span class="text-muted small">looking up…</span></div>
        ${kind !== "local" ? `<div class="small mt-2"><span class="muted-label">Fallback chain</span>${chainHtml(row.chain || [])}</div>` : ""}
      </div>
    </div>`;
  const footer = el("div", { class: "d-flex gap-2" });
  const m = openModal({ title: `${kind === "local" ? "File" : kind.toUpperCase()} details`, body, footer, size: "lg" });
  footer.append(mBtn("Close", "btn-outline-secondary", m.close),
    kind !== "local" ? mBtn("Play test", "btn-outline-primary", () => playInModal(`/preview-play/${kind}/${row.id}.ts`, row.custom_name), "bi-play-btn") : null);
  api(`/api/playlist/info?kind=${kind}&id=${row.id}`).then(d => {
    body.querySelector(".probe-box").innerHTML = probeHtml(d.probe);
    body.querySelector(".tmdb-box").innerHTML = tmdbHtml(d.tmdb);
  }).catch(() => {
    body.querySelector(".probe-box").innerHTML = '<span class="text-danger small">probe failed</span>';
    body.querySelector(".tmdb-box").innerHTML = "";
  });
};

/* ============================ bulk operations bar ============================ */
function bulkBar(kind, getTable, { allowGroup = true } = {}) {
  const bar = el("div", { class: "d-flex flex-wrap gap-1 align-items-center" });
  const table = () => getTable();
  const run = async (payload, msg) => {
    const ids = [...table().selected];
    if (!ids.length) return toast("select rows first", "warn");
    await api(`/api/playlist/${kind}/bulk`, { method: "POST", body: { ids, ...payload } });
    toast(msg, "ok"); table().reload();
  };
  bar.append(el("span", { class: "muted-label" }, "Bulk:"),
    mBtn("Enable", "btn-outline-success", () => run({ enabled: true }, "enabled"), "bi-check2"),
    mBtn("Disable", "btn-outline-secondary", () => run({ enabled: false }, "disabled"), "bi-x"));
  const mkAssign = (what) => () => {
    const ids = [...table().selected];
    if (!ids.length) return toast("select rows first", "warn");
    const body = el("div");
    body.innerHTML = what === "group"
      ? `<label class="muted-label">Group name (type or pick)</label>${groupDialogHtml("ba-val", "", "dl-bulk-" + kind)}`
      : `<label class="muted-label">FFmpeg template</label><select class="form-select" id="ba-val">${tplOptions()}</select>`;
    confirmDialog({ title: what === "group" ? "Assign group" : "Assign template",
      body, okText: `Apply to ${ids.length} ${kind} item(s)`,
      onOk: async () => {
        const v = body.querySelector("#ba-val").value;
        await api(`/api/playlist/${kind}/bulk`, { method: "POST", body: { ids, ...(what === "group" ? { group_name: v } : { ffmpeg_template_id: +v || null }) } });
        toast("bulk update applied", "ok"); table().reload();
      } });
  };
  bar.append(mBtn("Assign template…", "btn-outline-secondary", mkAssign("template"), "bi-gear"));
  if (allowGroup) bar.append(mBtn("Assign group…", "btn-outline-secondary", mkAssign("group"), "bi-tags"));
  bar.append(mBtn("Remove", "btn-outline-danger", () => {
    const ids = [...table().selected];
    if (!ids.length) return toast("select rows first", "warn");
    confirmDialog({ title: "Remove from playlist", okText: `Remove ${ids.length}`, okClass: "btn-danger",
      body: `Remove ${ids.length} ${kind} row(s) from the playlist? The sources themselves stay untouched in Input Sources.`,
      onOk: async () => {
        await api(`/api/playlist/${kind}/bulk`, { method: "POST", body: { ids, delete: true } });
        toast(`removed ${ids.length} row(s)`, "ok"); table().reload();
      } });
  }, "bi-trash"));
  return bar;
}

/* toolbar shared by the vod/series/local tabs: bulk add first, then bulk edit */
function builderBar(kind, getTable, primary) {
  const bar = el("div", { class: "d-flex flex-wrap gap-2 align-items-center" });
  bar.append(mBtn("Add from sources…", primary ? "btn-accent" : "btn-outline-secondary",
    () => addSourcesDialog(kind, () => getTable().reload()), "bi-plus-circle"),
    bulkBar(kind, getTable));
  return bar;
}

/* ==================== add from sources (bulk, group access) ====================
   Picking a whole genre/group and pushing it into the playlist with ONE request
   beats adding items one by one - one transaction server-side, one round trip. */
const ADD_LABEL = { live: "channels", vod: "VOD items", series: "series", local: "local files" };
function addSourcesDialog(kind, onDone) {
  const body = el("div");
  const host = el("div");
  const state = { onlyMissing: true };
  const missing = el("input", { type: "checkbox", class: "form-check-input" });
  missing.checked = true;
  missing.addEventListener("change", () => { state.onlyMissing = missing.checked; table.reload(); });
  const hint = el("label", { class: "small text-muted d-flex align-items-center gap-1" },
    missing, "hide items already in the playlist");
  const selAll = mBtn("Select all matching", "btn-outline-secondary", async () => {
    const p = new URLSearchParams(table.params());
    p.set("per_page", "500");
    p.set("only_missing", state.onlyMissing ? "true" : "false");
    let page = 1, seen = 0;                       // walk the pages: a group can hold thousands
    for (; page <= 40; page++) {
      p.set("page", String(page));
      const d = await api(`/api/playlist/candidates?kind=${kind}&${p.toString()}`);
      d.items.forEach(r => table.selected.add(r.id));
      seen += d.items.length;
      if (!d.items.length || seen >= (d.total || 0)) break;
    }
    table.reload(); updateCount();
    toast(`${table.selected.size} selected`, "ok");
  }, "bi-check-all");
  const clear = mBtn("Clear selection", "btn-outline-secondary", () => {
    table.selected.clear(); table.reload(); updateCount();
  }, "bi-x");
  const bar = el("div", { class: "d-flex flex-wrap gap-2 align-items-center mb-2" }, selAll, clear, hint);
  body.append(bar, host);

  const countLbl = el("span", { class: "small text-muted me-auto" });
  const updateCount = () => { countLbl.textContent = `${table.selected.size} selected`; };

  const table = new DataTable(host, {
    selectable: true, perPageDefault: 10, defaultSort: "name",
    server: async (p) => {
      const q = new URLSearchParams(p);
      q.set("only_missing", state.onlyMissing ? "true" : "false");
      return await api(`/api/playlist/candidates?kind=${kind}&${q.toString()}`);
    },
    columns: [
      { key: "name", label: "Name", sort: "name", filter: { type: "text", param: "q", placeholder: "name…" },
        render: r => `<b>${esc(r.name)}</b>` },
      { key: "group", label: kind === "local" ? "Directory" : "Group",
        filter: { type: "select", param: "group", placeholder: "all groups",
                  optionsLoader: async (fill) => {
                    const d = await api(`/api/playlist/candidates?kind=${kind}&per_page=5&only_missing=false`);
                    fill((d.groups || []).map(g => ({ v: g, l: g })));
                  } },
        render: r => `<span class="small">${esc(r.group || "")}</span>` },
      { key: "year", label: "Year", width: "64px", render: r => esc(r.year || "") },
      { key: "in_playlist", label: "In playlist", width: "90px",
        render: r => r.in_playlist ? '<span class="badge st-online">yes</span>' : "" },
    ],
    onSelection: () => updateCount(),
    emptyText: "No matching sources. Enable items under Input Sources first.",
  });

  const footer = el("div", { class: "d-flex gap-2 align-items-center" });
  const okBtn = mBtn(`Add to ${kind === "live" ? "playlist as channels" : "playlist"}`, "btn-accent",
    async () => {
      const ids = [...table.selected];
      if (!ids.length) return toast("select rows first", "warn");
      const res = await api("/api/playlist/add-sources", { method: "POST", body: { kind, ids } });
      toast(`added ${res.added} ${ADD_LABEL[kind]}` +
            (res.existed ? ` (${res.existed} already there)` : ""), "ok");
      m.close(); onDone?.();
    }, "bi-plus-circle");
  footer.append(countLbl, okBtn, mBtn("Close", "btn-outline-secondary", () => m.close()));
  const m = openModal({ title: `Add ${ADD_LABEL[kind]} from sources`, body, footer, size: "xl" });
  updateCount();
}

/* ============================ LIVE builder ============================ */
let liveTable;
function liveBuilder() {
  const bar = el("div", { class: "d-flex flex-wrap gap-2 align-items-center" });
  bar.append(
    mBtn("Add custom channel", "btn-accent", () => editCustomChannel(null), "bi-plus-circle"),
    builderBar("live", () => liveTable, false),
    el("a", { class: "btn btn-sm btn-outline-secondary", href: "/api/export?section=live_playlist" }, "⤓ Export"),
    el("span", { class: "small text-muted ms-auto" }, "Drag rows to reorder (only while sorted by Order)."));
  liveTable = new DataTable($("#pl-live"), {
    selectable: true, defaultSort: "order", extraHeader: bar,
    server: async (q) => await api("/api/playlist/live?" + q),
    columns: [
      { key: "enabled", label: "Enable", width: "60px", render: r => `<div class="form-check form-switch mb-0"><input class="form-check-input" type="checkbox" ${r.enabled ? "checked" : ""} onchange="event.stopPropagation();api('/api/playlist/live/${r.id}',{method:'PUT',body:{enabled:this.checked}})"></div>` },
      { key: "order", label: "Ord", sort: "order", width: "52px" },
      { key: "custom_name", label: "Custom name", sort: "name", filter: { type: "text", param: "q", placeholder: "name…" }, render: r => `<b>${esc(r.custom_name)}</b>` },
      { key: "group_name", label: "Group", sort: "group", filter: groupFilterLoader, render: r => groupCell("live", r) },
      { key: "chain", label: "Source chain (1=primary, then fallbacks)", render: r => chainHtml(r.chain) },
      { key: "epg_id", label: "EPG id", render: r => `<span class="mono small">${esc(r.epg_id || "")}</span>` },
      { key: "logo", label: "Logo", render: r => r.logo ? `<img class="logo-thumb" loading="lazy" src="${esc(r.logo)}" onerror="this.style.opacity=.2">` : "" },
      { key: "template", label: "FFmpeg tpl", render: r => tplInlineCell("live", r) },
      { key: "test", label: "", width: "36px", render: r => `<button class="btn btn-sm btn-outline-secondary" title="Play proxied stream" onclick="event.stopPropagation();playTest(${r.id},'live')"><i class="bi bi-play-btn"></i></button>` },
      { key: "actions", label: "", width: "70px", render: r => `
        <button class="btn btn-sm btn-outline-secondary" onclick="editCustomChannel(${r.id})"><i class="bi bi-pencil"></i></button>
        <button class="btn btn-sm btn-outline-danger" onclick="delCustom(${r.id})"><i class="bi bi-trash"></i></button>` },
    ],
    dnd: { onReorder: async (ids) => {
      await api("/api/playlist/live/order", { method: "POST",
        body: { items: ids.map((id, i) => ({ id, order: i + 1 })) } });
      toast("order saved", "ok");
    } },
    emptyText: "No custom channels yet. Click 'Add custom channel' (or 'Add from sources…' to turn a whole group of enabled channels into channels at once).",
  });
  PL_TABLES.live = liveTable;
}
window.delCustom = (id) => confirmDialog({ title: "Delete custom channel", body: "Remove this channel from the final playlist?",
  okText: "Delete", okClass: "btn-danger",
  onOk: async () => { await api(`/api/playlist/live/${id}`, { method: "DELETE" }); liveTable.reload(); } });

/* ---------------- Add / edit custom channel modal ---------------- */
async function editCustomChannel(id) {
  const row = id ? liveTable.items.find(x => x.id === id) : null;
  let chain = row ? row.chain.map(c => ({ id: c.source_id, name: c.name, portal: c.portal })) : [];
  const body = el("div");
  body.innerHTML = `
    <div class="row g-2">
      <div class="col-md-6">
        <label class="muted-label">Custom channel name (typing filters candidates below)</label>
        <input class="form-control form-control-sm" id="cc-name" value="${esc(row?.custom_name || "")}" autocomplete="off">
      </div>
      <div class="col-md-3"><label class="muted-label">Group (editable)</label>
        ${groupDialogHtml("cc-group", row?.group_name || "", "dl-cc")}</div>
      <div class="col-md-3"><label class="muted-label">EPG id (tvg-id)</label>
        <input class="form-control form-control-sm mono" id="cc-epg" value="${esc(row?.epg_id || "")}"></div>
      <div class="col-md-3"><label class="muted-label">FFmpeg template</label>
        <select class="form-select form-select-sm" id="cc-tpl">${tplOptions(row?.ffmpeg_template_id)}</select></div>
      <div class="col-md-3"><label class="muted-label">Channel number (opt)</label>
        <input class="form-control form-control-sm" id="cc-number" value="${row?.number ?? ""}"></div>
      <div class="col-md-6">
        <label class="muted-label">Logo URL</label>
        <div class="input-group input-group-sm">
          <input class="form-control" id="cc-logo" value="${esc(row?.logo || "")}">
          <button class="btn btn-outline-secondary" id="cc-logo-suggest">Suggest</button>
        </div>
        <div id="cc-logo-cand" class="d-flex gap-2 mt-1 flex-wrap"></div>
      </div>
    </div>
    <hr class="my-2">
    <div class="row g-2">
      <div class="col-md-6">
        <div class="d-flex justify-content-between"><span class="muted-label">Matching source channels (click → add to chain)</span>
          <span class="small text-muted" id="cc-count"></span></div>
        <div id="cc-cand" class="border rounded p-1" style="max-height:220px;overflow:auto"></div>
      </div>
      <div class="col-md-6">
        <div class="muted-label">Fallback chain (order = priority; first = primary · drag to reorder, or use ↑ ↓)</div>
        <div id="cc-chain" class="border rounded p-1" style="max-height:220px;overflow:auto"></div>
      </div>
    </div>`;
  const footer = el("div", { class: "d-flex gap-2" });
  const m = openModal({ title: row ? `Edit channel: ${row.custom_name}` : "Add custom channel", body, footer, size: "xl" });

  const candBox = $("#cc-cand", body), chainBox = $("#cc-chain", body);
  let dragIdx = null;
  const renderChain = () => {
    chainBox.innerHTML = chain.length ? "" : '<div class="small text-muted p-2">empty — click candidates on the left</div>';
    chain.forEach((c, i) => {
      const r = el("div", { class: "d-flex align-items-center gap-1 small mb-1 border-bottom pb-1", draggable: "true" });
      r.innerHTML = `<i class="bi bi-grip-vertical row-drag" title="drag to reorder"></i>
        <span class="badge ${i === 0 ? "text-bg-success" : "text-bg-secondary"}">${i + 1}</span>
        <span class="flex-grow-1">${esc(c.name)} <span class="text-muted">@ ${esc(c.portal)}</span></span>`;
      const mk = (t, fn) => { const b = el("button", { class: "btn btn-xs btn-outline-secondary py-0 px-1", html: t, type: "button" }); b.addEventListener("click", fn); return b; };
      r.append(mk("↑", () => { if (i > 0) [chain[i - 1], chain[i]] = [chain[i], chain[i - 1]], renderChain(); }),
               mk("↓", () => { if (i < chain.length - 1) [chain[i + 1], chain[i]] = [chain[i], chain[i + 1]], renderChain(); }),
               mk("✕", () => { chain.splice(i, 1); renderChain(); }));
      /* drag & drop reordering of the fallback chain */
      r.addEventListener("dragstart", () => { dragIdx = i; r.classList.add("dragging"); });
      r.addEventListener("dragend", () => { dragIdx = null; r.classList.remove("dragging"); $$( ".drop-highlight", chainBox).forEach(x => x.classList.remove("drop-highlight")); });
      r.addEventListener("dragover", (e) => { e.preventDefault(); r.classList.add("drop-highlight"); });
      r.addEventListener("dragleave", () => r.classList.remove("drop-highlight"));
      r.addEventListener("drop", (e) => {
        e.preventDefault(); r.classList.remove("drop-highlight");
        if (dragIdx === null || dragIdx === i) return;
        const [moved] = chain.splice(dragIdx, 1);
        chain.splice(i, 0, moved);
        renderChain();
      });
      chainBox.append(r);
    });
  };
  let deb;
  $("#cc-name", body).addEventListener("input", () => { clearTimeout(deb); deb = setTimeout(loadCand, 250); });
  async function loadCand() {
    const q = $("#cc-name", body).value;
    const d = await api(`/api/playlist/suggest?kind=live&q=${encodeURIComponent(q)}`);
    $("#cc-count", body).textContent = q ? `${d.items.length} matches` : `all enabled (${d.items.length})`;
    candBox.innerHTML = d.items.length ? "" : '<div class="small text-muted p-2">no close match — showing nothing; clear the name to list all enabled channels</div>';
    for (const c of d.items) {
      const b = el("button", { class: "btn btn-sm btn-light w-100 text-start mb-1 small", type: "button" });
      b.innerHTML = `${esc(c.name)} <span class="text-muted">@ ${esc(c.portal)}</span>`;
      b.addEventListener("click", () => {
        if (chain.some(x => x.id === c.id)) return toast("already in chain", "warn");
        chain.push(c); renderChain();
      });
      candBox.append(b);
    }
    /* logo candidates: portal logos of top matches (spec: portal first) */
    const logos = [...new Set(d.items.map(x => x.logo).filter(Boolean))].slice(0, 6);
    const lc = $("#cc-logo-cand", body); lc.innerHTML = logos.map(u =>
      `<img src="${esc(u)}" class="logo-thumb border rounded p-1" style="cursor:pointer;height:30px" title="use this logo"
        onclick="document.querySelector('#cc-logo').value='${esc(u)}'">`).join("");
  }
  $("#cc-logo-suggest", body).addEventListener("click", loadCand);
  footer.append(mBtn("Cancel", "btn-outline-secondary", m.close),
    mBtn("Save", "btn-accent", async () => {
      const payload = {
        custom_name: $("#cc-name", body).value.trim(),
        group_name: $("#cc-group", body).value.trim(),
        epg_id: $("#cc-epg", body).value.trim(),
        logo: $("#cc-logo", body).value.trim(),
        ffmpeg_template_id: +$("#cc-tpl", body).value || null,
        number: +$("#cc-number", body).value || null,
        source_ids: chain.map(c => c.id),
      };
      if (!payload.custom_name) return toast("name required", "warn");
      if (!payload.source_ids.length) return toast("add at least one source to the chain", "warn");
      if (row) await api(`/api/playlist/live/${row.id}`, { method: "PUT", body: payload });
      else await api("/api/playlist/live", { method: "POST", body: payload });
      toast("channel saved", "ok"); m.close(); liveTable.reload();
    }, "bi-check2"));
  renderChain(); loadCand();
}

      { key: "custom_name", label: "Title", sort: "name", filter: { type: "text", param: "q", placeholder: "title…" }, render: r => `<b>${esc(r.custom_name)}</b>` },

      { key: "year", label: "Year", width: "56px" },

window.editVod = async (id) => {

  body.innerHTML = `
    <div class="d-flex gap-3 mb-2 border-bottom pb-2">
      ${row.poster ? `<img src="${esc(row.poster)}" style="width:70px;border-radius:6px">` : ""}
      <div class="small flex-grow-1">
        <div class="d-flex justify-content-between align-items-start"><div class="muted-label mb-0">Info</div>
          <button class="btn btn-xs btn-outline-secondary" onclick="showDetails('vod', PL_TABLES.vod.items.find(x=>x.id===${row.id}))"><i class="bi bi-info-circle"></i> details popup</button></div>
        <div>${row.year ? "Year " + esc(row.year) + " · " : ""}${row.rating ? "★ " + esc(row.rating) + " · " : ""}${esc(row.overview ? (row.overview.length > 140 ? row.overview.slice(0, 140) + "…" : row.overview) : "no description")}</div>
      </div>
    </div>
    <div class="row g-2">
      <div class="col-md-6"><label class="muted-label">Custom title</label><input class="form-control form-control-sm" id="v-name" value="${esc(row.custom_name)}"></div>
      <div class="col-md-4"><label class="muted-label">Group</label>${groupDialogHtml("v-group", row.group_name || "", "dl-v")}</div>
      <div class="col-md-4"><label class="muted-label">FFmpeg template</label><select class="form-select form-select-sm" id="v-tpl">${tplOptions(row.ffmpeg_template_id)}</select></div>
    </div><div class="small text-muted mt-2">Logo/poster: automatic (portal/TMDB) per Phase-1 decision Q1=C.</div>`;
  const footer = el("div", { class: "d-flex gap-2" });
  const m = openModal({ title: "Edit VOD item", body, footer, size: "lg" });
  footer.append(mBtn("Cancel", "btn-outline-secondary", m.close),
    mBtn("Save", "btn-accent", async () => {
      await api(`/api/playlist/vod/${id}`, { method: "PUT", body: { custom_name: $("#v-name", body).value, group_name: $("#v-group", body).value, ffmpeg_template_id: +$("#v-tpl", body).value || null } });
      toast("saved", "ok"); m.close(); vodTable.reload();
    }));
};

      { key: "poster", label: "", width: "44px", render: r => r.poster ? `<img class="poster-thumb" src="${esc(r.poster)}" loading="lazy">` : "" },

      { key: "group_name", label: "Group", sort: "group", filter: groupFilterLoader, render: r => groupCell("series", r) },
      { key: "seasons", label: "Seasons in output", render: r => r.seasons.map(s => `
          <span class="badge ${s.enabled ? "st-online" : "st-unknown"} me-1" style="cursor:pointer" title="toggle season"
            onclick="togglePlSeason(${r.id}, ${s.link_id}, ${s.enabled ? "false" : "true"})">S${String(s.season_number).padStart(2, "0")}</span>`).join("") +
        `<div class="small text-muted">${r.enabled_episode_count} episodes total</div>` },
      { key: "template", label: "FFmpeg tpl", render: r => tplInlineCell("series", r) },
      { key: "actions", label: "", width: "140px", render: r => `
        <button class="btn btn-sm btn-outline-secondary" title="Details (poster / info)" onclick="showDetails('series', PL_TABLES.series.items.find(x=>x.id===${r.id}))"><i class="bi bi-info-circle"></i></button>

}
window.togglePlSeason = async (pid, linkId, enabled) => {
  await api(`/api/playlist/series/${pid}`, { method: "PUT", body: { seasons: [{ link_id: linkId, enabled }] } });
  seriesTable.reload();
};
window.editSeries = async (id) => {
  const row = seriesTable.items.find(x => x.id === id);
  const body = el("div");
  body.innerHTML = `
    <div class="d-flex gap-3 mb-2 border-bottom pb-2">
      ${row.poster ? `<img src="${esc(row.poster)}" style="width:70px;border-radius:6px">` : ""}
      <div class="small flex-grow-1">
        <div class="d-flex justify-content-between align-items-start"><div class="muted-label mb-0">Info</div>
          <button class="btn btn-xs btn-outline-secondary" onclick="showDetails('series', PL_TABLES.series.items.find(x=>x.id===${row.id}))"><i class="bi bi-info-circle"></i> details popup</button></div>
        <div>${row.year ? "Year " + esc(row.year) + " · " : ""}${row.rating ? "★ " + esc(row.rating) + " · " : ""}${esc(row.overview ? (row.overview.length > 140 ? row.overview.slice(0, 140) + "…" : row.overview) : "no description")}</div>
      </div>
    </div>
    <div class="row g-2">
      <div class="col-md-6"><label class="muted-label">Custom title</label><input class="form-control form-control-sm" id="s-name" value="${esc(row.custom_name)}"></div>
      <div class="col-md-4"><label class="muted-label">Group</label>${groupDialogHtml("s-group", row.group_name || "", "dl-s")}</div>
      <div class="col-md-4"><label class="muted-label">FFmpeg template</label><select class="form-select form-select-sm" id="s-tpl">${tplOptions(row.ffmpeg_template_id)}</select></div>
    </div>
    <div class="muted-label mt-2">Enabled seasons</div>
    <div>${row.seasons.map(s => `<label class="me-2 small"><input type="checkbox" class="s-season" data-link="${s.link_id}" ${s.enabled ? "checked" : ""}> ${esc(s.name || "S" + s.season_number)}</label>`).join("")}</div>`;
  const footer = el("div", { class: "d-flex gap-2" });
  const m = openModal({ title: "Edit series", body, footer, size: "lg" });
  footer.append(mBtn("Cancel", "btn-outline-secondary", m.close),
    mBtn("Save", "btn-accent", async () => {
      const seasons = $$(".s-season", body).map(i => ({ link_id: +i.dataset.link, enabled: i.checked }));
      await api(`/api/playlist/series/${id}`, { method: "PUT", body: { custom_name: $("#s-name", body).value, group_name: $("#s-group", body).value, ffmpeg_template_id: +$("#s-tpl", body).value || null, seasons } });

  footer.append(mBtn("Cancel", "btn-outline-secondary", m.close),

/* ---------------- boot ---------------- */
(async () => {
  await loadTemplates();
  liveBuilder(); vodBuilder(); seriesBuilder(); localBuilder();
  $$("#pl-tabs .nav-link").forEach(a => a.addEventListener("click", (e) => {
    e.preventDefault();
    $$("#pl-tabs .nav-link").forEach(x => x.classList.remove("active"));
    a.classList.add("active");
    for (const k of ["live", "vod", "series", "local"])
      $("#pl-" + k).classList.toggle("d-none", k !== a.dataset.tab);
  }));
})();
</script>
