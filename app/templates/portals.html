{% extends "base.html" %}
{% block content %}
<div class="card">
  <div class="card-header d-flex flex-wrap gap-2 align-items-center">
    <span><i class="bi bi-hdd-network"></i> Portals</span>
    <div class="ms-auto d-flex flex-wrap gap-1">
      <button class="btn btn-sm btn-accent" id="btn-add"><i class="bi bi-plus-circle"></i> Add portal</button>
      <button class="btn btn-sm btn-outline-secondary" id="btn-test-sel"><i class="bi bi-plug"></i> Test selected</button>
      <button class="btn btn-sm btn-outline-secondary" id="btn-test-all"><i class="bi bi-plug-fill"></i> Test all</button>
      <button class="btn btn-sm btn-outline-danger" id="btn-del-sel"><i class="bi bi-trash"></i> Delete selected</button>
      <span class="vr mx-1"></span>
      <a class="btn btn-sm btn-outline-secondary" href="/api/export?section=portals"><i class="bi bi-download"></i> Export</a>
      <button class="btn btn-sm btn-outline-secondary" id="btn-import"><i class="bi bi-upload"></i> Import</button>
      {% if mock_enabled %}<button class="btn btn-sm btn-outline-warning" id="btn-mock"><i class="bi bi-bug"></i> Mock control</button>{% endif %}
      <button class="btn btn-sm btn-outline-secondary" id="btn-reload"><i class="bi bi-arrow-clockwise"></i></button>
    </div>
  </div>
  <div class="card-body p-2">
    <div id="portals-table"></div>
    <div class="muted-label mt-2">Fetch history / running jobs</div>
    <div id="jobs-box" class="small"></div>
  </div>
</div>
<input type="file" id="import-file" accept="application/json" class="d-none">
{% endblock %}

{% block scripts %}
<script>
/* ============================= portals table ============================= */
let table;
function statusBadge(m) {
  // `banned` / `expired` are what the PANEL says about the account (they come from
  // get_profile / account_info) and take the MAC out of every fallback chain;
  // `offline` / `error` are our own verdicts about transport and stay retryable.
  // The tooltip is the panel's own wording, so "why" needs no log dive.
  const cls = { online: "st-online", offline: "st-offline", unauthorized: "st-unauthorized",
                expired: "st-expired", banned: "st-unauthorized", error: "st-error" }[m.status] || "st-unknown";
  const why = esc(m.last_error || "");
  return `<span class="badge badge-status ${cls}" ${why ? `title="${why}"` : ""}>${m.online ? "online" : m.status}</span>`;
}
function pinIdentity(pid, mid, mac, sn, deviceId) {
  // Derived-from-MAC is the default and the right answer for almost every panel;
  // this exists for the box whose real serial the portal has already enrolled.
  const next = prompt(`Pinned STB identity for ${mac} - leave a field empty to derive it from the MAC again.\n\nFormat: [serial][, device id]`,
                      [sn || "", deviceId || ""].filter(Boolean).join(", "));
  if (next === null) return;
  const parts = next.split(/[,\s]+/).filter(Boolean);
  const p = table.items.find(x => x.id === pid);
  const macs = p.macs.map(m => m.id === mid
    ? { mac: m.mac, sn: parts[0] || "", device_id: parts[1] || "" }
    : { mac: m.mac, sn: m.sn || "", device_id: m.device_id || "" });
  api(`/api/portals/${pid}`, { method: "PUT", body: { macs } }).then(() => { toast("STB identity updated", "ok"); table.reload(); });
}
/* ---------------------------------------------------------------- xtream bridge
   One renderer for the table badge and the modal panel, so the two can never
   disagree about what "adopted" means. Everything in `r.xtream` is masked by the
   API: the harvested password is stored (it has to be usable) and never echoed. */
function xtreamHtml(row, inModal) {
  const x = (row && row.xtream) || {};
  const a = x.account || {}, c = x.creds || {};
  const btn = (what, label, cls, tip) =>
    `<button class="btn btn-sm ${cls} py-0" title="${esc(tip)}" onclick="xtreamAct('${what}')">${label}</button>`;
  if (!x.found) {
    const why = x.why || (inModal
      ? "never looked — Detect asks the panel for one stream link and reads the credentials out of it"
      : "not looked for");
    if (!inModal) return `<span class="small text-muted" title="${esc(why)}">—</span>`;
    return `<div class="small text-muted mb-1">${esc(why)}</div>
      <div class="d-flex gap-2 align-items-center flex-wrap">
        ${btn("detect", "Detect", "btn-outline-primary", "one create_link, read-only: it stores what it finds and changes no playback")}
        <div class="form-check form-switch mb-0 ms-auto">
          <input class="form-check-input" type="checkbox" id="p-xtream-force">
          <label class="form-check-label small" for="p-xtream-force">re-read even if an account is already stored</label></div>
      </div>`;
  }
  const cls = a.status === "online" ? "st-online"
            : (a.status === "error" || a.status === "banned" ? "st-error"
            : (a.status === "expired" ? "st-expired" : "st-unknown"));
  const bits = [];
  if (a.exp_date) bits.push(`expires ${esc(a.exp_date)}`);
  if (a.created_at) bits.push(`created ${esc(a.created_at)}`);
  if (a.active_cons != null || a.max_connections != null)
    bits.push(`connections ${esc(String(a.active_cons ?? "?"))}/${esc(String(a.max_connections ?? "?"))}`);
  if (a.is_trial) bits.push("trial account");
  if (a.error) bits.push(esc(a.error));
  const tip = `${c.username || "?"}@${c.base || "?"}\n${bits.join("\n") || "the panel said nothing about this account"}`
    + (c.api_url ? `\n${c.api_url}` : "");
  const head = `<span class="badge ${cls}" title="${esc("the panel's own word about the Xtream account")}">${esc(a.status || "unknown")}</span>
    <span class="mono small">${esc(c.username || "?")}@${esc(c.base || "?")}</span>
    ${row.xtream_adopted ? '<span class="badge st-online" title="matched channels play this link: no create_link, no MAC slot">adopted</span>'
                         : '<span class="badge text-bg-warning" title="nothing has changed about how this portal plays">offered</span>'}`;
  if (!inModal) return `<span title="${esc(tip)}">${head}</span>`;
  const act = row.xtream_adopted
    ? `${btn("detach", "Detach", "btn-outline-secondary", "every channel goes back to the portal path; the per-channel links stay unless you check clear")}
       <div class="form-check form-switch mb-0"><input class="form-check-input" type="checkbox" id="p-xtream-clear">
       <label class="form-check-label small" for="p-xtream-clear">also clear the per-channel links</label></div>`
    : `${btn("adopt", "Adopt as Xtream source (read-only)", "btn-accent",
        "match the Xtream catalogue to the channels we already have, per channel. Refused if the panel reports the account expired, banned or unusable unless you force it")}
       <div class="form-check form-switch mb-0"><input class="form-check-input" type="checkbox" id="p-xtream-force">
       <label class="form-check-label small" for="p-xtream-force">force (use it even if the panel refuses the account)</label></div>`;
  return `<div class="d-flex flex-wrap gap-2 align-items-center">
      <span class="me-auto" title="${esc(tip)}">${head}</span>
      ${btn("detect", "Re-detect", "btn-outline-secondary", "ask the panel again (it costs one create_link)")}
      ${act}
    </div>
    <div class="small text-muted mt-1">${esc(bits.slice(0, 2).join(" · ") || "no account details")}
      ${x.adopted_at ? " · adopted " + esc(x.adopted_at) : ""}</div>`;
}

function makeTable() {
  table = new DataTable($("#portals-table"), {
    selectable: true,
    server: async () => {
      const d = await api("/api/portals");
      renderJobs(d.jobs);
      return { total: d.items.length, items: d.items };
    },
    columns: [
      { key: "enabled", label: "On", width: "40px", render: r =>
        `<div class="form-check form-switch mb-0"><input class="form-check-input" type="checkbox" ${r.enabled ? "checked" : ""}
          onchange="api('/api/portals/${r.id}',{method:'PUT',body:{enabled:this.checked}}).then(()=>toast('portal ${r.enabled ? "disabled" : "enabled"}','ok'))"></div>` },
      { key: "name", label: "Portal", sort: "name", render: r => `<b>${esc(r.name)}</b><div class="small text-muted mono">${esc(r.base_url)}</div>`
          /* visible in the list, not only in the editor: an unverified portal is
             a deliberate exception and should be easy to spot and remove */
          + (r.tls_insecure ? '<div><span class="badge text-bg-warning" title="certificate verification is OFF for this portal"><i class="bi bi-shield-exclamation"></i> TLS unverified</span></div>' : ""),
        filter: { type: "text", placeholder: "name…" } },
      { key: "resolved_path", label: "Resolved path", render: r => r.resolved_url ? `<span class="badge text-bg-light mono">${esc(r.resolved_path || "?")}</span>` : '<span class="text-muted small">not resolved</span>' },
      /* what the panel said about itself (version.js + get_modules, read on
         Resolve). In the list and not only in the editor, because it is the first
         line of any "this portal behaves oddly" report - and a VOD catalogue
         that is empty stops being a mystery once the row says `no vclub`. */
      { key: "portal_version", label: "Panel", render: r => {
          const mods = r.modules || null;
          const off = Object.entries(r.features || {}).filter(([, v]) => v === false).map(([k]) => k);
          const ver = r.portal_version ? `<span class="badge text-bg-info">${esc(r.portal_version)}</span>` : "";
          const caps = mods === null
            ? '<span class="small text-muted" title="get_modules never answered, so nothing about this panel is assumed">capabilities unknown</span>'
            : `<span class="badge text-bg-light mono" title="modules: ${esc(mods.join(", "))}">${mods.length} modules</span>`;
          const warn = off.length ? `<span class="badge text-bg-secondary" title="the panel says it has no ${esc(off.join(", "))} - those fetches are skipped">no ${esc(off.join(", "))}</span>` : "";
          return (ver || caps || warn)
            ? `<div class="d-flex flex-wrap gap-1">${ver}${caps}${warn}</div>`
            : '<span class="text-muted small">press Resolve</span>';
        } },
      /* R7 in one badge per row: "offered" means we found an account and have
         changed nothing, which is the whole point of keeping the two steps apart */
      { key: "xtream", label: "Xtream", width: "150px", render: r => xtreamHtml(r, false) },
      { key: "macs", label: "MAC addresses", render: r => r.macs.map(m => `
          <div class="d-flex align-items-center gap-2 mb-1">
            <span class="mono small">${esc(m.mac)}</span> ${statusBadge(m)}
            <span class="small text-muted">${esc(m.expire_date || "")}</span>
            <button class="btn btn-xs btn-outline-secondary py-0 px-1" title="STB identity this portal is told (serial, device id) - pin the values your box really sends"
              onclick="pinIdentity(${r.id}, ${m.id}, '${m.mac}', '${esc(m.sn || "")}', '${esc(m.device_id || "")}')"><i class="bi bi-cpu"></i></button>
            <button class="btn btn-xs btn-outline-danger py-0 px-1" title="delete mac"
              onclick="delMac(${r.id}, '${m.mac}')"><i class="bi bi-x"></i></button>
          </div>`).join("") || '<span class="text-muted small">none</span>' },
      { key: "actions", label: "Actions", render: r => `
        <div class="btn-group btn-group-sm">
          <button class="btn btn-outline-secondary" title="Edit / genres / content" onclick="editPortal(${r.id})"><i class="bi bi-pencil"></i></button>
          <button class="btn btn-outline-secondary" title="Resolve URL" onclick="resolvePortal(${r.id})"><i class="bi bi-signpost-split"></i></button>
          <button class="btn btn-outline-secondary" title="Fetch content" onclick="fetchPortal(${r.id})"><i class="bi bi-cloud-download"></i></button>
          <button class="btn btn-outline-danger" title="Delete" onclick="deletePortal(${r.id})"><i class="bi bi-trash"></i></button>
        </div>` },
    ],
    emptyText: "No portals yet — click 'Add portal'. " + ({{ mock_enabled|tojson }} ? "Demo portal: " + {{ mock_portal_url|tojson }} + "  MACs: " + {{ mock_macs|tojson }} : ""),
  });
  table.state.filters = {}; // server fn ignores; client-side filter for name:
}
/* client-side portal name filter: reuse the text filter input */
function hookClientFilter() {
  const inp = $("#portals-table thead .filters input");
  if (!inp || inp._hooked) return; inp._hooked = true;
  inp.addEventListener("input", () => {
    const q = inp.value.toLowerCase();
    $$("#portals-table tbody tr").forEach(tr => {
      tr.style.display = tr.textContent.toLowerCase().includes(q) ? "" : "none";
    });
  });
}
const _origReload = null;

function renderJobs(jobs) {
  const box = $("#jobs-box");
  if (!jobs.length) { box.innerHTML = ""; return; }
  box.innerHTML = jobs.map(j => `
    <div class="d-flex align-items-center gap-2 border rounded px-2 py-1 mb-1 bg-light">
      <span class="badge text-bg-${j.status === "running" ? "primary" : j.status === "done" ? "success" : j.status === "error" ? "danger" : "secondary"}">${j.status}</span>
      <span class="flex-grow-1">fetch · portal #${j.portal_id} — <b>${esc(j.stage)}</b> ${esc(j.detail)} — ${j.done_items}${j.total_items ? "/" + j.total_items : ""} items</span>
      ${(j.status === "running" || j.status === "queued") ? `<button class="btn btn-sm btn-outline-danger" onclick="api('/api/portals/jobs/${j.id}/cancel',{method:'POST'}).then(()=>toast('cancel requested','warn'))">cancel</button>` : ""}
    </div>`).join("");
}

/* ============================= add / edit modal ============================= */
async function editPortal(id) {
  const p = id ? table.items.find(x => x.id === id) : { name: "", base_url: "", enabled: true, macs: "", proxy_url: "", tls_insecure: false, identity_mode: "mag250", stb_timezone: "", direct_links: true };
  const body = el("div");
  body.innerHTML = `
    <div>
      <div class="row g-2">
        <div class="col-md-6"><label class="muted-label">Portal name</label>
          <input class="form-control form-control-sm" id="p-name" value="${esc(p.name)}"></div>
        <div class="col-md-6"><label class="muted-label">URL (any path style: /c/, /portal.php, /stalker_portal/c/…)</label>
          <div class="input-group input-group-sm"><input class="form-control" id="p-url" value="${esc(p.base_url)}" placeholder="http://host:port/c/">
          <button class="btn btn-outline-secondary" id="p-resolve-btn" ${id ? `data-id="${id}"` : "disabled"}>Resolve</button></div>
          <div class="small text-muted" id="p-resolve-out"></div></div>
        <div class="col-12"><label class="muted-label">MAC addresses (comma, semicolon, space or one per line)</label>
          <textarea class="form-control mono" id="p-macs" rows="3">${esc(Array.isArray(p.macs) ? p.macs.map(m => m.mac).join(", ") : p.macs)}</textarea></div>
        <div class="col-md-4"><label class="muted-label">HTTP proxy (optional)</label>
          <input class="form-control form-control-sm" id="p-proxy" value="${esc(p.proxy_url || "")}" placeholder="http://ip:port"></div>
        <div class="col-md-4 d-flex align-items-end"><div class="form-check form-switch">
          <input class="form-check-input" type="checkbox" id="p-enabled" ${p.enabled ? "checked" : ""}>
          <label class="form-check-label">Portal enabled</label></div></div>
        <div class="col-md-4 d-flex align-items-end"><div class="form-check form-switch">
          <input class="form-check-input" type="checkbox" id="p-tls" ${p.tls_insecure ? "checked" : ""}>
          <label class="form-check-label" for="p-tls">Allow broken TLS</label>
          <div class="small text-muted">off by default - only for a panel with a self-signed /
            incomplete cert chain; it disables certificate verification for THIS portal only</div></div></div>
        <div class="col-md-4"><label class="muted-label" for="p-identity">Portal identity we advertise</label>
          <select class="form-select form-select-sm" id="p-identity">
            <option value="mag250"${(p.identity_mode || "mag250") === "mag250" ? " selected" : ""}>MAG250 fingerprint (default)</option>
            <option value="minimal"${(p.identity_mode || "") === "minimal" ? " selected" : ""}>minimal (no fingerprint)</option>
          </select>
          <div class="small text-muted">a panel decides how much to answer partly by how much we look
            like the box it enrolled. Switch to <b>minimal</b> if a portal only started refusing us
            after we began sending a serial it never enrolled</div></div>
        <div class="col-md-4"><label class="muted-label" for="p-tz">STB timezone cookie</label>
          <input class="form-control form-control-sm" id="p-tz" value="${esc(p.stb_timezone || "")}" placeholder="Europe/Amsterdam">
          <div class="small text-muted">the <span class="mono">timezone</span> cookie a real box sends;
            blank keeps the server default</div></div>
        <div class="col-md-4 d-flex align-items-end"><div class="form-check form-switch">
          <input class="form-check-input" type="checkbox" id="p-direct-links" ${p.direct_links === false ? "" : "checked"}>
          <label class="form-check-label" for="p-direct-links">Play stored links when the panel allows</label>
          <div class="small text-muted">on by default: a channel whose own flags say its link is
            permanent is handed to the player as-is, with no <span class="mono">create_link</span>
            round trip. Turn it off for a panel whose flags lie — every stream then asks first,
            which is also the liveness check the fallback chain uses</div></div></div>
        <div class="col-12"><label class="muted-label">Xtream bridge</label>
          <div class="border rounded p-2" id="p-xtream"></div>
          <div class="small text-muted mt-1">some panels are an Xtream account wearing a Stalker
            portal: their <span class="mono">create_link</span> answer carries
            <span class="mono">/live/&lt;user&gt;/&lt;password&gt;/</span>. Detect reads it once
            (one request, read-only); <b>Adopt</b> is the only step that changes how you watch —
            matched channels then play that link with no <span class="mono">create_link</span>,
            no token and no MAC slot, and each channel keeps its portal <span class="mono">cmd</span>
            beside it so Detach is one flag. Nothing here is automatic, and the password is stored
            in the database because a masked backup would be a bridge that bridges nothing.</div></div>
        <div class="col-md-4 d-flex align-items-end justify-content-end">
          <button class="btn btn-sm btn-outline-primary" id="p-fetch-btn" ${id ? "" : "disabled"}><i class="bi bi-cloud-download"></i> Fetch genres</button>
        </div>
      </div>
      <div class="small text-muted mt-2">Two API calls: <b>Fetch genres</b> loads the genre lists → enable/disable the genres you want per tab → <b>Save</b> fetches the channels of the enabled genres (live, VOD, series).</div>
    </div>
    <ul class="nav nav-tabs nav-subtabs mt-3 mb-2">
      <li class="nav-item"><a class="nav-link active" data-tab="live">1 · Live</a></li>
      <li class="nav-item"><a class="nav-link" data-tab="vod">2 · VOD</a></li>
      <li class="nav-item"><a class="nav-link" data-tab="series">3 · Series</a></li>
    </ul>
    ${["live", "vod", "series"].map(k => `
      <div data-pane="${k}" class="${k === "live" ? "" : "d-none"}">
        <div class="d-flex gap-2 align-items-center mb-2">
          <input class="form-control form-control-sm" style="max-width:260px" id="genre-q-${k}" placeholder="filter genres…">
          <span class="small text-muted ms-auto" id="genre-count-${k}"></span>
        </div>
        <!-- multi-column genre list (long genre catalogs stay compact) -->
        <div class="border rounded p-2 genre-grid" style="max-height:260px;overflow:auto" id="genre-list-${k}"><div class="text-muted small p-1">No genres fetched yet — press “Fetch genres”.</div></div>
      </div>`).join("")}`;
  const footer = el("div", { class: "d-flex gap-2 w-100" });
  const m = openModal({ title: id ? `Edit portal: ${p.name}` : "Add portal", body, footer, size: "xl" });
  /* Popup state: the portal id (existing, or assigned when a NEW portal is
     first saved / when "Fetch genres" creates it), a created-in-this-popup
     flag, and a double-submit guard. */
  const state = { pid: id, createdHere: !id, saving: false };
  const portalPayload = () => ({
    name: $("#p-name", body).value.trim(), base_url: $("#p-url", body).value.trim(),
    macs: $("#p-macs", body).value, enabled: $("#p-enabled", body).checked,
    proxy_url: $("#p-proxy", body).value.trim() || null,
    tls_insecure: $("#p-tls", body).checked,
    identity_mode: $("#p-identity", body).value,
    stb_timezone: $("#p-tz", body).value.trim() || null,
    direct_links: $("#p-direct-links", body).checked,
  });
  /* ONE builder for "what a portal's fields are". `savePortal` used to assemble
     its own shorter list, so pressing Save dropped the identity and timezone
     choices filled in two rows above it - a field is either in the payload or it
     does not exist. */
  state.payload = portalPayload;
  /* ---- the Xtream panel in this popup (R7) -------------------------------
     The three buttons post to their own endpoints rather than to Save, because
     Save is "what the portal *is*" and this is "what we decided about it": a
     half-filled form must never be able to change playback by accident.
     `state.portal` is the freshest row we have - each endpoint returns the
     portal it just wrote, so the panel repaints without a second GET. */
  state.portal = p;
  const renderXtream = () => {
    const host = $("#p-xtream", body);
    if (host) host.innerHTML = xtreamHtml(state.portal, true);
  };
  state.xtreamAct = async (what) => {
    if (!state.pid) return toast("save this portal first - the bridge is per portal", "warn");
    const clear = what === "detach" && $("#p-xtream-clear", body)?.checked;
    const force = what !== "detach" && $("#p-xtream-force", body)?.checked;
    const qs = clear ? "?clear=1" : (force ? "?force=1" : "");
    const d = await api(`/api/portals/${state.pid}/xtream${what === "detect" ? "" : "/" + what}${qs}`,
                        { method: "POST" });
    if (d.portal) state.portal = d.portal;
    renderXtream();
    table.reload();
    if (what === "adopt")
      toast(`${d.adopted} channel(s) now play the panel's own Xtream links`, "ok");
    else if (what === "detach")
      toast(clear ? "xtream links cleared - every play uses the portal path again"
                  : "xtream links kept but unused - every play uses the portal path again", "info");
    else
      toast(d.found ? "xtream account found - nothing changes until you adopt it"
                    : "this panel has no xtream side: " + (d.why || "no credentials in its links"),
            d.found ? "ok" : "info");
  };
  window.xtreamAct = (what) => state.xtreamAct(what);
  renderXtream();
  footer.append(mBtn("Cancel", "btn-outline-secondary", m.close),
                mBtn("Save", "btn-accent", () => savePortal(state, body, m), "bi-check2"));

  /* sub-tab switching: general stays visible, only the 3 genre panes toggle */
  $$(".nav-link", body).forEach(a => a.addEventListener("click", (e) => {
    e.preventDefault();
    $$(".nav-link", body).forEach(x => x.classList.remove("active"));
    a.classList.add("active");
    $$("[data-pane]", body).forEach(pn => pn.classList.toggle("d-none", pn.dataset.pane !== a.dataset.tab));
    if (state.pid) loadGenres(state.pid, a.dataset.tab);
  }));

  if (state.pid) {
    $("#p-resolve-btn", body).setAttribute("data-id", state.pid);
    loadGenres(state.pid, "live");
  }

  /* API 1 - "Fetch genres": needs a saved portal id, so for a NEW portal the
     button turns on as soon as URL + MAC are entered and on first use it
     creates the portal, then fetches the genre lists. The popup stays open so
     the genres can be enabled right here. */
  const fetchBtn = $("#p-fetch-btn", body);
  const updateFetchBtn = () => {
    fetchBtn.disabled = !state.pid &&
      (!$("#p-url", body).value.trim() || !$("#p-macs", body).value.trim());
  };
  state.updateFetchBtn = updateFetchBtn;
  $("#p-url", body).addEventListener("input", updateFetchBtn);
  $("#p-macs", body).addEventListener("input", updateFetchBtn);
  updateFetchBtn();

  $("#p-resolve-btn", body).addEventListener("click", async () => {
    const pid = $("#p-resolve-btn", body).dataset.id || state.pid;
    if (!pid) { toast("Save the portal first, then resolve.", "warn"); return; }
    $("#p-resolve-out", body).textContent = "probing paths…";
    const r = await api(`/api/portals/${pid}/resolve`, { method: "POST" });
    /* what the panel told us about itself, right under the URL it answered with:
       version.js needs no token so it is nearly always available, while "no
       module answer" is a fact worth seeing rather than a silent null */
    const caps = (r.version || r.modules)
      ? `<div class="small mt-1">
           ${r.version && r.version.label ? `<span class="badge text-bg-info">${esc(r.version.label)}</span>` : `<span class="text-muted small">version.js: ${esc((r.version && r.version.error) || "nothing")}</span>`}
           ${r.modules ? `<span class="mono small" title="modules the panel offers and has enabled">${esc(r.modules.join(", "))}</span>` : `<span class="text-muted small">no module answer (${esc(r.modules_error || "get_modules")})</span>`}
           ${r.referer ? `<div class="text-muted mono" title="the Referer every request to this portal claims">${esc(r.referer)}</div>` : ""}
         </div>` : "";
    $("#p-resolve-out", body).innerHTML = r.ok
      ? `<span class="text-success">OK → ${esc(r.resolved_url)}</span>${caps}`
      : `<span class="text-danger">failed: ${esc(r.error)}</span>` +
        `<details class="mt-1"><summary class="small">probe log</summary><pre class="mono small">${r.attempts.map(esc).join("\n")}</pre></details>`;
  });
  fetchBtn.addEventListener("click", async () => {
    if (state.saving) return;
    const data = portalPayload();
    if (!data.name || !data.base_url) return toast("name and URL are required", "warn");
    if (!state.pid && !data.macs.trim()) return toast("enter at least one MAC address", "warn");
    state.saving = true; fetchBtn.disabled = true;
    try {
      if (!state.pid) {
        /* fetch-genres is a per-portal API: create the portal first, stay in
           the popup (mere creation fires NO fetch API) */
        const r = await api("/api/portals", { method: "POST", body: data });
        state.pid = r.id;
        $("#p-resolve-btn", body).removeAttribute("disabled");
        $("#p-resolve-btn", body).setAttribute("data-id", r.id);
        table.reload();
        toast("portal saved — fetching genre lists…", "ok");
      }
      const r = await api(`/api/portals/${state.pid}/fetch-genres`, { method: "POST" });
      toast(`fetching genre lists (job ${r.job.id})…`, "ok"); pollJobs();
      // refresh the genre panes as soon as the genre fetch finishes
      waitJob(r.job.id, async () => {
        ["live", "vod", "series"].forEach(k => loadGenres(state.pid, k));
        const d = await api("/api/portals");
        const j = d.jobs.find(x => x.id === r.job.id);
        if (j && j.status === "error")
          toast(`genre fetch failed: ${j.error} — check the fetch history below`, "error");
        else
          toast("genre lists loaded — enable the genres you want, then Save fetches their channels", "ok");
      });
    } finally { state.saving = false; updateFetchBtn(); }
  });
  for (const evt of ["input", "keyup"]) {
    /* Genre filter boxes: filter the genre list below the box LIVE, while the
       user types. One delegated listener per event on the popup body (works
       for all three panes and survives every list re-render); `keyup` covers
       IME/autofill edge cases where `input` may not fire. */
    body.addEventListener(evt, (e) => {
      const inp = e.target?.closest?.("#genre-q-live, #genre-q-vod, #genre-q-series");
      if (inp) filterGenrePane(inp.closest("[data-pane]"));
    });
  }
}

/* Live client-side genre filter: hides the genre rows of one pane that do not
 * match what is typed in that pane's filter box (case-insensitive), and keeps
 * the "matching/total" counter in sync. Called on every keystroke and after
 * every (re-)render of the list, so a filter stays applied. */
function filterGenrePane(pane) {
  if (!pane) return;
  const kind = pane.dataset.pane;
  const q = $(`#genre-q-${kind}`, pane);
  const host = $(`#genre-list-${kind}`, pane);
  const cnt = $(`#genre-count-${kind}`, pane);
  if (!host) return;
  const needle = (q ? q.value : "").trim().toLowerCase();
  let vis = 0, all = 0;
  $$("label", host).forEach(lb => {
    all++;
    const name = (lb.dataset.name || lb.textContent || "").toLowerCase();
    const show = !needle || name.includes(needle);
    lb.classList.toggle("d-none", !show);
    if (show) vis++;
  });
  if (cnt) cnt.textContent = all ? (needle ? `${vis}/${all}` : `${all}`) : "";
}

async function loadGenres(pid, kind) {
  if (!["live", "vod", "series"].includes(kind)) return;
  const d = await api(`/api/portals/${pid}/genres`);
  const host = $(`#genre-list-${kind}`);
  if (!host) return;
  const rows = d[kind] || [];
  /* one switch per genre, applied immediately (no bulk selection/apply) */
  host.innerHTML = rows.length ? rows.map(g => `
    <label class="d-flex align-items-center gap-2 small mb-1" data-name="${esc(g.name.toLowerCase())}">
      <span class="form-check form-switch mb-0"><input class="form-check-input" type="checkbox"
        value="${g.id}" ${g.enabled ? "checked" : ""}></span>
      <span class="flex-grow-1">${esc(g.name)}</span>
      <span class="text-muted">${g.item_count ?? "?"} items ${g.fetched ? "· fetched" : ""}</span>
    </label>`).join("") : '<div class="text-muted small p-1">No genres fetched yet — press “Fetch genres”.</div>';
  $$(`input[type=checkbox]`, host).forEach(cb => cb.addEventListener("change", async () => {
    await api(`/api/portals/${pid}/genres/toggle`, { method: "POST",
      body: { kind, ids: [+cb.value], enabled: cb.checked } });
    toast(`genre ${cb.checked ? "enabled" : "disabled"} — use Fetch to (un)load its items`, "ok");
  }));
  /* re-apply the pane's filter (if any) to the freshly rendered list so a
     typed query stays in effect across re-renders (tab switch, refetch) */
  filterGenrePane(host.closest("[data-pane]"));
  host.dataset.loaded = "1";
}

/* true when at least one genre in any of the three panes is enabled; loads
   panes that were never rendered yet so the check matches the server state */
async function anyGenreEnabled(pid, body) {
  for (const k of ["live", "vod", "series"]) {
    const host = $(`#genre-list-${k}`, body);
    if (host && !host.dataset.loaded) await loadGenres(pid, k);
    if ($(`#genre-list-${k} input[type=checkbox]:checked`, body)) return true;
  }
  return false;
}

async function savePortal(state, body, m) {
  if (state.saving) return;
  const data = state.payload();
  if (!data.name || !data.base_url) return toast("name and URL are required", "warn");
  state.saving = true;
  try {
    if (!state.pid) {
      /* brand-new portal: Save only stores it - NO fetch API fires here. The
         genre fetch is the explicit "Fetch genres" button (API 1); the channel
         fetch is this same Save pressed again after enabling genres (API 2).
         Keep the popup open so that flow can continue. */
      const r = await api("/api/portals", { method: "POST", body: data });
      state.pid = r.id;
      $("#p-resolve-btn", body).removeAttribute("disabled");
      $("#p-resolve-btn", body).setAttribute("data-id", r.id);
      table.reload(); state.updateFetchBtn?.();
      toast("portal saved — press “Fetch genres” to load the genre lists, enable the genres you want, then Save again to fetch their channels", "ok");
      return;
    }
    await api(`/api/portals/${state.pid}`, { method: "PUT", body: data });
    /* API 2 on Save: fetch the channels of the genres that are enabled right
       now (live, VOD, series). A portal created in this popup must have at
       least one genre enabled first - genres arrive disabled from the fetch. */
    if (state.createdHere && !(await anyGenreEnabled(state.pid, body))) {
      toast("no genres enabled — press “Fetch genres” to load the genre lists, enable the genres you want, then Save", "warn");
      return; // stay in the popup
    }
    const r = await api(`/api/portals/${state.pid}/fetch-items`, { method: "POST" });
    toast(`saved — fetching channels of enabled genres (job ${r.job.id})`, "ok");
    m.close(); table.reload(); pollJobs();
  } finally { state.saving = false; }
}

/* ============================= actions ============================= */
async function resolvePortal(id) {
  toast("resolving portal…", "info");
  const r = await api(`/api/portals/${id}/resolve`, { method: "POST" });
  r.ok ? toast(`resolved: ${r.resolved_url}${r.version && r.version.label ? " · " + r.version.label : ""}`, "ok")
       : toast("resolve failed — see logs", "error");
  table.reload();
}
async function fetchPortal(id) {
  const r = await api(`/api/portals/${id}/fetch`, { method: "POST" });
  toast(`fetch job started (${r.job.id})`, "ok"); pollJobs();
}
function delMac(pid, mac) {
  const p = table.items.find(x => x.id === pid);
  const left = p.macs.filter(m => m.mac !== mac).map(m => m.mac).join(", ");
  confirmDialog({ title: "Delete MAC", body: `Remove <span class="mono">${esc(mac)}</span> from <b>${esc(p.name)}</b>?`,
    okText: "Delete", okClass: "btn-danger",
    onOk: async () => { await api(`/api/portals/${pid}`, { method: "PUT", body: { macs: left } }); table.reload(); } });
}
async function deletePortal(id) {
  const p = table.items.find(x => x.id === id);
  const chk = await api(`/api/portals/${id}/delete-check`);
  if (!chk.in_use) {
    return confirmDialog({ title: "Delete portal", okText: "Delete", okClass: "btn-danger",
      body: `Delete <b>${esc(p.name)}</b>? All its MACs, genres, sources and playlist references are removed permanently.`,
      onOk: async () => { await api(`/api/portals/${id}`, { method: "DELETE" }); toast("portal deleted", "warn"); table.reload(); } });
  }
  /* in use as fallback -> warn + offer replace (spec G-flow) */
  const uses = [...chk.usage.live, ...chk.usage.vod, ...chk.usage.series];
  const body = el("div");
  body.innerHTML = `
    <div class="alert alert-warning py-2 small mb-2"><b>${uses.length}</b> playlist fallback reference(s) point at this portal:</div>
    <div class="border rounded p-2 small mb-2" style="max-height:160px;overflow:auto">
      ${uses.slice(0, 40).map(u => `<div>· ${esc(u.name)} <span class="text-muted">(priority ${u.priority})</span></div>`).join("")}
      ${uses.length > 40 ? `<div class="text-muted">…and ${uses.length - 40} more</div>` : ""}</div>
    <label class="muted-label">Action</label>
    <select class="form-select form-select-sm" id="del-mode">
      <option value="remove">Delete portal and REMOVE these references</option>
      <option value="replace">Delete portal and TRY to replace with similar sources from another portal</option>
    </select>
    <div id="del-repl" class="mt-2 d-none"><label class="muted-label">Replacement portal</label>
      <select class="form-select form-select-sm" id="del-repl-id">
        ${chk.replacement_candidates.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join("")}
      </select><div class="small text-muted">Best-effort case-insensitive name match.</div></div>`;
  const footer = el("div", { class: "d-flex gap-2" });
  const m = openModal({ title: `Portal in use: ${p.name}`, body, footer, size: "lg" });
  body.querySelector("#del-mode").addEventListener("change", (e) =>
    body.querySelector("#del-repl").classList.toggle("d-none", e.target.value !== "replace"));
  footer.append(mBtn("Cancel", "btn-outline-secondary", m.close));
  footer.append(mBtn("Delete portal", "btn-danger", async () => {
    const mode = body.querySelector("#del-mode").value;
    const repl = mode === "replace" ? +body.querySelector("#del-repl-id").value : null;
    const q = repl ? `?replacement_portal_id=${repl}` : "";
    const r = await api(`/api/portals/${id}${q}`, { method: "DELETE" });
    toast(`portal deleted${r.repointed ? `, ${r.repointed} fallbacks repointed` : ""}`, "warn");
    m.close(); table.reload();
  }));
}

$("#import-file").addEventListener("change", async (e) => {

  const data = JSON.parse(await f.text());
  const r = await api("/api/import", { method: "POST", body: { mode: "merge", data } });

{% if mock_enabled %}
$("#btn-mock").addEventListener("click", async () => {
  const st = (await api("/mock/_state")).state;
  const body = el("div");
  body.innerHTML = `
    <div class="form-check form-switch mb-2"><input class="form-check-input" id="mc-off" ${st.offline ? "checked" : ""} type="checkbox"><label class="form-check-label">Portal OFFLINE (all mock calls fail)</label></div>
    <div class="form-check form-switch mb-2"><input class="form-check-input" id="mc-slow" ${st.slow ? "checked" : ""} type="checkbox"><label class="form-check-label">Slow responses (+3s latency)</label></div>
    <label class="muted-label">Max concurrent streams per MAC</label>
    <select class="form-select form-select-sm" id="mc-max" style="width:120px"><option value="0" ${st.max_per_mac==0?"selected":""}>0 (always busy)</option><option value="1" ${st.max_per_mac==1?"selected":""}>1</option><option value="3" ${st.max_per_mac==3?"selected":""}>3</option></select>
    <div class="small text-muted mt-2">Current usage: ${Object.entries(st.usage).map(([m, n]) => m.split(":").slice(-2).join(":") + "→" + n).join(", ") || "none"}</div>`;
  const footer = el("div", { class: "d-flex gap-2" });
  const m = openModal({ title: "Mock portal control (test fallback)", body, footer, size: "md" });
  footer.append(mBtn("Close", "btn-outline-secondary", m.close),
    mBtn("Apply", "btn-accent", async () => {
      await api("/mock/_control", { method: "POST", body: { offline: $("#mc-off", body).checked, slow: $("#mc-slow", body).checked, max_per_mac: +$("#mc-max", body).value } });
      toast("mock portal updated", "ok"); m.close();
    }));
});
{% endif %}

let jobTimer = null;
async function pollJobs() {
  if (jobTimer) clearInterval(jobTimer);
  jobTimer = setInterval(async () => {
    const d = await api("/api/portals"); renderJobs(d.jobs);
    if (!d.jobs.some(j => j.status === "running" || j.status === "queued")) { clearInterval(jobTimer); jobTimer = null; table.reload(); }
  }, 1500);
}
/* call back once a specific background job leaves queued/running (or times out) */
function waitJob(jobId, onDone, timeoutMs = 300000) {
  const t0 = Date.now();
  const t = setInterval(async () => {
    let done = Date.now() - t0 > timeoutMs;
    try {
      const d = await api("/api/portals");
      const j = d.jobs.find(x => x.id === jobId);
      done = done || (j && j.status !== "queued" && j.status !== "running");
    } catch (e) {}
    if (done) { clearInterval(t); onDone(); }
  }, 1500);
}
makeTable();
setTimeout(hookClientFilter, 400);
