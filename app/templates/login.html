<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login · Stalker Proxy Manager</title>
  {{ favicon_tags() }}
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/static/css/app.css" rel="stylesheet">
</head>
<body class="d-flex align-items-center justify-content-center" style="min-height:100vh;background:var(--spm-slate-2)">
  <div class="card" style="width:340px">
    <div class="card-body p-4">
      <h5 class="mb-1 text-center"><span class="text-accent">●</span> Stalker Proxy Manager</h5>
      <p class="text-muted text-center small mb-4">admin console</p>
      {% if error %}<div class="alert alert-danger py-1 small">{{ error }}</div>{% endif %}
      <form method="post" action="/login">
        <div class="mb-2"><label class="form-label small">Username</label>
          <input class="form-control" name="username" autofocus></div>
        <div class="mb-3"><label class="form-label small">Password</label>
          <input class="form-control" type="password" name="password"></div>
        <button class="btn btn-accent w-100">Sign in</button>
      </form>
      <p class="small text-muted mt-3 mb-0 text-center">default: admin / admin — set SPM_ADMIN_USER / SPM_ADMIN_PASSWORD</p>
    </div>
  </div>
</body>
</html>
