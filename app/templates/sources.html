{% extends "base.html" %}
{% block content %}
<div class="card">
  <div class="card-header pb-0">
    <ul class="nav nav-tabs card-header-tabs nav-subtabs" id="src-tabs">
      <li class="nav-item"><a class="nav-link active" data-tab="live"><i class="bi bi-tv"></i> Live channels</a></li>
      <li class="nav-item"><a class="nav-link" data-tab="vod"><i class="bi bi-film"></i> VOD</a></li>
      <li class="nav-item"><a class="nav-link" data-tab="series"><i class="bi bi-collection"></i> Series</a></li>
      <li class="nav-item"><a class="nav-link" data-tab="local"><i class="bi bi-folder2-open"></i> Local</a></li>
    </ul>
  </div>
  <div class="card-body p-2">
    <div id="pane-live"></div>
    <div id="pane-vod" class="d-none"></div>
    <div id="pane-series" class="d-none"></div>
    <div id="pane-local" class="d-none"></div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let PORTALS = [], GENRES = { live: [], vod: [], series: [] };

async function loadMeta() {
  const d = await api("/api/portals");
  PORTALS = d.items.map(p => ({ v: p.id, l: p.name }));
  GENRES = { live: [], vod: [], series: [] };
  for (const p of d.items) {
    const g = await api(`/api/portals/${p.id}/genres`);
    for (const k of ["live", "vod", "series"])
      for (const row of g[k])
        if (row.enabled) GENRES[k].push({ v: row.id, l: `${p.name}: ${row.name}` });
  }
  for (const k of ["live", "vod", "series"])
    GENRES[k].sort((a, b) => a.l.localeCompare(b.l));          // alphabetical, only enabled genres
}

function sourceTable(kind, hostSel) {
  const bulkBar = el("div", { class: "d-flex gap-2 align-items-center" });
  const bulk = (enabled) => async () => {
    const ids = [...t.selected];
    if (!ids.length) return toast("select rows first", "warn");
    const res = await api("/api/sources/toggle", { method: "POST", body: { kind, ids, enabled } });
    t.reload(); toast(`${ids.length} ${kind} source(s) ${enabled ? "enabled" : "disabled"}`, "ok");
    if (kind === "series" && enabled && (res.season_jobs || []).length)
      waitForSeasons(ids, t);
  };
  bulkBar.append(
    el("span", { class: "muted-label" }, "Bulk:"),
    mBtn("Enable selected", "btn-outline-success", bulk(true), "bi-check2"),
    mBtn("Disable selected", "btn-outline-secondary", bulk(false), "bi-x"));
  const cols = {
    live: [
      { key: "enabled", label: "On", width: "36px", render: r => `<div class="form-check form-switch mb-0"><input class="form-check-input" type="checkbox" ${r.enabled ? "checked" : ""} onchange="event.stopPropagation();api('/api/sources/toggle',{method:'POST',body:{kind:'${kind}',ids:[${r.id}],enabled:this.checked}})"></div>` },
      { key: "number", label: "#", sort: "id", width: "50px", render: r => esc(r.number || "") },
      { key: "logo", label: "Logo", width: "70px", render: r => r.logo ? `<img class="logo-thumb" loading="lazy" src="${esc(r.logo)}" onerror="this.style.display='none'">` : "" },
      { key: "name", label: "Channel", sort: "name", class: "col-channel", width: "190px",
        filter: { type: "text", param: "q", placeholder: "name…" },
        render: r => esc(r.name) + (r.xtream_url
          ? ` <span class="badge text-bg-light" title="${esc(r.xtream_url)}">this channel plays the portal's own Xtream link (no create_link, no MAC slot)</span>`
          : "") },
      /* Custom Channel Name: filled only for enabled sources. Editing assigns
         a new custom channel when the name is unique, or attaches this source
         as a fallback on the existing custom channel when the name already
         exists. Resolved in the /api/sources/live payload — no extra round trip.
         It is the column people actually TYPE in, so it is the wide one; the
         portal's own (read-only) channel name next to it is ellipsised. */
      { key: "playlist_name", label: "Custom Channel Name", class: "col-name", width: "340px",
        render: r => playlistNameCell(r) },
      { key: "portal_id", label: "Portal", sort: "portal", filter: { type: "select", options: PORTALS }, render: r => esc(r.portal) },
      { key: "genre_id", label: "Genre", filter: { type: "select", options: GENRES.live, placeholder: "enabled genres" }, render: r => esc(r.genre) },
      { key: "play", label: "", width: "40px", render: r => `<button class="btn btn-sm btn-outline-secondary" title="Test stream (original)" onclick="event.stopPropagation();playInModal('/preview/live/${r.id}.ts',${JSON.stringify(r.name).replace(/"/g, '&quot;')})"><i class="bi bi-play-btn"></i></button>` },
    ],
    vod: [
      { key: "enabled", label: "On", width: "36px", render: r => `<div class="form-check form-switch mb-0"><input class="form-check-input" type="checkbox" ${r.enabled ? "checked" : ""} onchange="event.stopPropagation();api('/api/sources/toggle',{method:'POST',body:{kind:'vod',ids:[${r.id}],enabled:this.checked}})"></div>` },
      { key: "position", label: "Pos", sort: "id", width: "55px", render: r => r.position ?? "" },
      { key: "poster", label: "Poster", width: "48px", render: r => r.poster ? `<img class="poster-thumb" loading="lazy" src="${esc(r.poster)}" onerror="this.src='/static/css/../css/none'">` : "" },
      { key: "name", label: "Title", sort: "name", filter: { type: "text", param: "q", placeholder: "title…" }, render: r => esc(r.name) },
      { key: "year", label: "Year", width: "60px" },
      { key: "rating", label: "★", width: "50px" },
      { key: "portal_id", label: "Portal", sort: "portal", filter: { type: "select", options: PORTALS }, render: r => esc(r.portal) },
      { key: "genre_id", label: "Genre", filter: { type: "select", options: GENRES.vod, placeholder: "enabled genres" }, render: r => esc(r.genre) },
      { key: "play", label: "", width: "40px", render: r => `<button class="btn btn-sm btn-outline-secondary" title="Test stream" onclick="event.stopPropagation();playInModal('/preview/vod/${r.id}.ts',${JSON.stringify(r.name).replace(/"/g, '&quot;')})"><i class="bi bi-play-btn"></i></button>` },
    ],
    series: [
      { key: "enabled", label: "On", width: "36px", render: r => `<div class="form-check form-switch mb-0"><input class="form-check-input" type="checkbox" ${r.enabled ? "checked" : ""} onchange="event.stopPropagation();toggleSerie(${r.id}, this.checked)"></div>` },
      { key: "poster", label: "Poster", width: "48px", render: r => r.poster ? `<img class="poster-thumb" loading="lazy" src="${esc(r.poster)}">` : "" },
      { key: "name", label: "Series", sort: "name", filter: { type: "text", param: "q", placeholder: "title…" }, render: r => esc(r.name) },
      { key: "year", label: "Year", width: "60px" },
      { key: "portal_id", label: "Portal", sort: "portal", filter: { type: "select", options: PORTALS }, render: r => esc(r.portal) },
      { key: "genre_id", label: "Genre", filter: { type: "select", options: GENRES.series, placeholder: "enabled genres" }, render: r => esc(r.genre) },
      { key: "seasons_fetched", label: "Seasons", width: "80px", render: r => r.seasons_fetched ? '<span class="badge st-online">loaded</span>' : '<span class="badge st-unknown">pending</span>' },
    ],
  }[kind];
  const t = new DataTable($(hostSel), {
    selectable: true, defaultSort: "name",
    server: async (q) => await api(`/api/sources/${kind}?` + q),
    columns: cols, extraHeader: bulkBar,
    onRowClick: kind === "vod" ? vodDetail : kind === "series" ? seriesDetail : null,
    emptyText: "Nothing here yet. Fetch a portal (Portals → Fetch) and enable genres first.",
  });
  return t;
}

/* "Custom Channel Name" cell (Input Sources → Live).
   Disabled sources stay blank. Enabled ones show the current custom name
   (or the portal original as the default) and save on blur / Enter. */
function playlistNameCell(r) {
  if (!r.enabled) {
    return `<span class="text-muted small" title="enable the channel to give it a custom name">—</span>`;
  }
  const name = r.playlist_name || r.name || "";
  let badge = "";
  if (r.playlist_id && r.playlist_is_primary === false) {
    badge = ` <span class="badge text-bg-secondary" title="fallback #${r.playlist_priority} of ${r.playlist_chain_len || "?"} on this custom channel">fb #${r.playlist_priority}</span>`;
  } else if (r.playlist_id && r.playlist_is_primary) {
    badge = ` <span class="badge text-bg-success" title="primary source of this custom channel">primary</span>`;
  }
  // stopPropagation so typing / clicking the input does not select the row
  // mouseup preventDefault keeps the select-all from collapsing when the
  // click that focused the field also places the caret.
  return `<div class="d-flex align-items-center gap-1" onclick="event.stopPropagation()">
    <input class="form-control form-control-sm flex-grow-1" style="min-width:200px"
      value="${esc(name)}"
      placeholder="custom channel name…"
      title="Click to edit. Unique name → new custom channel. Existing name → this source becomes a fallback."
      onfocus="this.select()"
      onmouseup="event.preventDefault()"
      onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur();}"
      onblur="saveLivePlaylistName(${r.id}, this)">
    ${badge}
  </div>`;
}
window.saveLivePlaylistName = async (sid, input) => {
  const value = (input.value || "").trim();
  if (!value) { toast("name required", "warn"); return; }
  // Skip the round trip when nothing changed.
  const row = (TABS.live?.items || []).find(x => x.id === sid);
  if (row && (row.playlist_name || row.name || "") === value) return;
  try {
    input.disabled = true;
    const res = await api(`/api/sources/live/${sid}/playlist-name`, {
      method: "POST", body: { custom_name: value },
    });
    const msg = res.action === "created" ? `custom channel "${res.custom_name}" created`
              : res.action === "renamed" ? `renamed to "${res.custom_name}"`
              : res.action === "fallback" ? `added as fallback on "${res.custom_name}"`
              : "unchanged";
    toast(msg, "ok");
    TABS.live && TABS.live.reload();
  } catch (e) {
    /* api() already toasted the error */
  } finally {
    input.disabled = false;
  }
};

window.toggleSerie = async (id, enabled) => {
  const res = await api("/api/sources/toggle", { method: "POST", body: { kind: "series", ids: [id], enabled } });
  if (enabled && (res.season_jobs || []).length) {
    toast("fetching seasons for this series…", "ok");
    waitForSeasons([id], TABS.series);
  }
};
async function waitForSeasons(ids, table) {
  const want = new Set(ids.map(Number));
  for (let i = 0; i < 40; i++) {
    await new Promise(r => setTimeout(r, 1500));
    try {
      const d = await api("/api/sources/series?per_page=100&" + (table ? table.params() : "page=1"));
      const rows = (d.items || []).filter(x => want.has(x.id));
      if (rows.length && rows.every(x => x.seasons_fetched)) {
        toast("seasons loaded — open the series to pick which to enable", "ok");
        table && table.reload();
        return;
      }
    } catch { /* keep polling */ }
  }
  table && table.reload();
}

/* detail popups (data from portal; TMDB merge lands in Phase 3) */
async function vodDetail(row) {
  const { item } = await api(`/api/sources/vod/${row.id}`);
  const body = el("div");
  body.innerHTML = `
    <div class="d-flex gap-3">
      <div>${item.poster ? `<img src="${esc(item.poster)}" style="width:130px;border-radius:6px">` : '<div class="poster-thumb" style="width:130px;height:180px"></div>'}</div>
      <div class="flex-grow-1">
        <h6>${esc(item.name)} ${item.year ? `<span class="text-muted">(${esc(item.year)})</span>` : ""} ${item.rating ? `<span class="badge text-bg-warning">★ ${esc(item.rating)}</span>` : ""}</h6>
        <div class="small text-muted mb-2">${esc(item.portal)} · ${esc(item.genre)} ${item.duration ? "· " + esc(item.duration) + " min" : ""}</div>
        <p class="small">${esc(item.description || "No description from portal.")}</p>
        ${item.director ? `<div class="small"><b>Director:</b> ${esc(item.director)}</div>` : ""}
        ${item.actors ? `<div class="small"><b>Cast:</b> ${esc(item.actors)}</div>` : ""}
        <div class="muted-label mt-2">Stream info (probe)</div>
        <div class="probe-box"><span class="text-muted small">probing the primary source stream…</span></div>
        <div class="muted-label mt-2">TMDB</div>
        <div class="tmdb-box"><span class="text-muted small">looking up…</span></div>
      </div>
    </div>`;
  const footer = el("div", { class: "d-flex gap-2" });
  const m = openModal({ title: "VOD details", body, footer, size: "lg" });
  { const mediaKind = "vod"; /* after open: load probe + TMDB lazily (endpoints are slow by nature) */
  api(`/api/sources/media-info?kind=${mediaKind}&id=${item.id}`).then(d => {
    body.querySelector(".probe-box").innerHTML = probeHtml(d.probe);
    body.querySelector(".tmdb-box").innerHTML = tmdbHtml(d.tmdb);
  }).catch(() => {
    body.querySelector(".probe-box").innerHTML = '<span class="text-danger small">probe failed</span>';
  }); }
  footer.append(mBtn("Close", "btn-outline-secondary", m.close),
    mBtn("Play test", "btn-outline-primary", () => playInModal(`/preview/vod/${item.id}.ts`, item.name), "bi-play-btn"),
    mBtn(item.enabled ? "Disable" : "Enable in output", "btn-accent", async () => {
      await api("/api/sources/toggle", { method: "POST", body: { kind: "vod", ids: [item.id], enabled: !item.enabled } });
      m.close(); TABS.vod.reload();
    }, "bi-check2"));
}

async function seriesDetail(row) {
  const { item } = await api(`/api/sources/series/${row.id}`);
  const body = el("div");
  body.innerHTML = `
    <div class="d-flex gap-3">
      <div>${item.poster ? `<img src="${esc(item.poster)}" style="width:130px;border-radius:6px">` : '<div class="poster-thumb" style="width:130px;height:180px"></div>'}</div>
      <div class="flex-grow-1">
        <h6>${esc(item.name)} ${item.year ? `<span class="text-muted">(${esc(item.year)})</span>` : ""} ${item.rating ? `<span class="badge text-bg-warning">★ ${esc(item.rating)}</span>` : ""}</h6>
        <div class="small text-muted mb-2">${esc(item.portal)} · ${esc(item.genre)}</div>
        <p class="small">${esc(item.description || "No description from portal.")}</p>
        <div class="d-flex align-items-center gap-2">
          <div class="muted-label mb-0">Seasons (fetched)</div>
          ${item.seasons.length ? `<button type="button" class="btn btn-xs btn-outline-secondary" id="src-seasons-on">Enable all</button>
          <button type="button" class="btn btn-xs btn-outline-secondary" id="src-seasons-off">Disable all</button>` : ""}
        </div>
        ${item.seasons.length ? item.seasons.map(s => `
          <label class="d-flex gap-2 align-items-center small mb-1">
            <input type="checkbox" class="src-season" data-id="${s.id}" ${s.enabled ? "checked" : ""} onchange="api('/api/sources/series/seasons/toggle',{method:'POST',body:{ids:[${s.id}],enabled:this.checked}}).then(()=>toast('season updated','ok'))">
            <span>${esc(s.name || "Season " + s.season_number)}</span>
            <span class="text-muted">${s.episode_count} episodes ${s.episodes_fetched ? "" : "· pending fetch"}</span>
          </label>`).join("") : `<div class="small text-muted">${item.enabled ? "seasons are being fetched — close and reopen this popup in a moment" : "enable the series (switch in the list) to fetch seasons"}</div>`}
        <div class="muted-label mt-2">Stream info (first episode probe)</div>
        <div class="probe-box"><span class="text-muted small">probing the first playable episode…</span></div>
        <div class="muted-label mt-2">TMDB</div>
        <div class="tmdb-box"><span class="text-muted small">looking up…</span></div>
      </div>
    </div>`;
  const footer = el("div", { class: "d-flex gap-2" });
  const m = openModal({ title: "Series details", body, footer, size: "lg" });
  const setSrcSeasons = async (enabled) => {
    const boxes = $$(".src-season", body);
    const ids = boxes.map(i => +i.dataset.id);
    if (!ids.length) return;
    await api("/api/sources/series/seasons/toggle", { method: "POST", body: { ids, enabled } });
    boxes.forEach(i => { i.checked = enabled; });
    toast(enabled ? "all seasons enabled" : "all seasons disabled", "ok");
  };
  $("#src-seasons-on", body)?.addEventListener("click", () => setSrcSeasons(true));
  $("#src-seasons-off", body)?.addEventListener("click", () => setSrcSeasons(false));
  { const mediaKind = "series"; /* after open: load probe + TMDB lazily (endpoints are slow by nature) */
  api(`/api/sources/media-info?kind=${mediaKind}&id=${item.id}`).then(d => {
    body.querySelector(".probe-box").innerHTML = probeHtml(d.probe);
    body.querySelector(".tmdb-box").innerHTML = tmdbHtml(d.tmdb);
  }).catch(() => {
    body.querySelector(".probe-box").innerHTML = '<span class="text-danger small">probe failed</span>';
  }); }
  footer.append(mBtn("Close", "btn-outline-secondary", m.close),
    mBtn("Refetch seasons", "btn-outline-primary", async () => {
      await api("/api/sources/series/refetch", { method: "POST", body: { ids: [item.id] } });
      toast("seasons/episodes reset — fetching again in the background", "ok");
      m.close();
    }, "bi-arrow-repeat"));
}

/* ----------------------------- local tab ----------------------------- */
function localTab(hostSel) {
  const host = $(hostSel);
  host.innerHTML = `<div class="row g-3"><div class="col-lg-5">
      <div class="d-flex flex-wrap gap-2 mb-2">
        <button class="btn btn-sm btn-accent" id="ld-add"><i class="bi bi-folder-plus"></i> Add directory</button>
        <button class="btn btn-sm btn-outline-primary" id="ld-fetch" title="Scan every enabled directory for video files">
          <i class="bi bi-cloud-download"></i> Fetch media files</button>
        <button class="btn btn-sm btn-outline-secondary" id="ld-scan"><i class="bi bi-arrow-repeat"></i> Scan selected</button>
      </div><div id="ldirs"></div>
    </div><div class="col-lg-7"><div class="muted-label mb-1">Scanned video files (used by the Local playlist builder)</div><div id="lfiles"></div></div></div>`;
  const dt = new DataTable($("#ldirs"), {
    selectable: true, perPageDefault: 10,
    server: async (q) => await api("/api/sources/local/dirs?" + q),
    columns: [
      { key: "enabled", label: "On", width: "36px", render: r => `<div class="form-check form-switch mb-0"><input class="form-check-input" type="checkbox" ${r.enabled ? "checked" : ""} onchange="api('/api/sources/local/dirs/toggle',{method:'POST',body:{ids:[${r.id}],enabled:this.checked}})"></div>` },
      { key: "directory", label: "Directory", sort: "directory", filter: { type: "text", param: "q", placeholder: "path…" }, render: r => `<span class="mono small">${esc(r.directory)}</span>` },
      { key: "file_count", label: "Files", width: "60px" },
      { key: "actions", label: "", width: "70px", render: r => `
        <button class="btn btn-sm btn-outline-secondary" title="Edit" onclick="editDir(${r.id}, '${esc(r.directory).replace(/'/g, "\\'")}')"><i class="bi bi-pencil"></i></button>
        <button class="btn btn-sm btn-outline-danger" title="Delete" onclick="delDir(${r.id})"><i class="bi bi-trash"></i></button>` },
    ],
    emptyText: "No directories yet. Add paths inside the mounted /media volume.",
  });
  const runScan = async (ids) => {
    const r = await api("/api/sources/local/scan", { method: "POST", body: { ids } });
    toast(`fetched ${r.new} new file(s) (${r.seen} seen`
      + (r.playlist_added ? `, ${r.playlist_added} added to playlist` : "")
      + (r.skipped ? `, ${r.skipped} skipped` : "") + ")", "ok");
    dt.reload(); ft.reload();
    return r;
  };
  window.editDir = (id, dir) => browseDir(dir, async (path) => {
    await api(`/api/sources/local/dirs`, { method: "POST", body: { directory: path } }).catch(() => {});
    dt.reload(); ft.reload();
  });
  window.delDir = (id) => confirmDialog({ title: "Delete directory", body: "Remove this directory and its scanned files from the app? (Files on disk stay untouched.)",
    okText: "Delete", okClass: "btn-danger", onOk: async () => { await api(`/api/sources/local/dirs/${id}`, { method: "DELETE" }); dt.reload(); ft.reload(); } });
  $("#ld-add").addEventListener("click", () => browseDir("", async (path) => {
    const added = await api("/api/sources/local/dirs", { method: "POST", body: { directory: path } });
    const sc = added.scan || {};
    toast(`directory added · fetched ${sc.new ?? 0} file(s)`, "ok");
    dt.reload(); ft.reload();
  }));
  $("#ld-fetch").addEventListener("click", () => runScan([]));
  $("#ld-scan").addEventListener("click", async () => {
    const ids = [...dt.selected];
    if (!ids.length) return toast("select directories, or use Fetch media files for all enabled ones", "warn");
    await runScan(ids);
  });
  const fileBulk = el("div", { class: "d-flex gap-2 align-items-center flex-wrap" });
  const ft = new DataTable($("#lfiles"), {
    selectable: true, perPageDefault: 15, defaultSort: "path",
    extraHeader: fileBulk,
    server: async (q) => await api("/api/sources/local/files?" + q),
    columns: [
      { key: "enabled", label: "On", width: "48px",
        render: r => `<span class="badge ${r.enabled ? "st-online" : "st-unknown"}"
          role="button" tabindex="0"
          title="${r.enabled ? "click to disable this file" : "click to enable this file"}"
          style="cursor:pointer"
          onclick="event.stopPropagation();toggleLocalFile(${r.id}, ${r.enabled ? "true" : "false"}, this)">${r.enabled ? "on" : "off"}</span>` },
      { key: "filename", label: "Filename", sort: "filename", filter: { type: "text", param: "q", placeholder: "file…" }, render: r => esc(r.filename) },
      { key: "relative_path", label: "Path", sort: "path", render: r => `<span class="mono small text-muted">${esc(r.relative_path)}</span>` },
      { key: "size_bytes", label: "Size", render: r => r.size_bytes ? (r.size_bytes / 1048576).toFixed(0) + " MB" : "" },
    ],
    emptyText: "Scan a directory to list its videos here.",
  });
  const bulkLocalFiles = (enabled) => async () => {
    const ids = [...ft.selected];
    if (!ids.length) return toast("select files first", "warn");
    const res = await api("/api/sources/local/files/toggle", {
      method: "POST", body: { ids, enabled },
    });
    ft.selected.clear();
    ft.reload();
    toast(`${res.count} file(s) ${enabled ? "enabled" : "disabled"}`, "ok");
  };
  fileBulk.append(
    el("span", { class: "muted-label" }, "Bulk:"),
    mBtn("Enable selected", "btn-outline-success", bulkLocalFiles(true), "bi-check2"),
    mBtn("Disable selected", "btn-outline-secondary", bulkLocalFiles(false), "bi-x"));
  TABS.localFiles = ft;
}
window.toggleLocalFile = async (id, enabled, el) => {
  const next = !enabled;
  try {
    await api("/api/sources/local/files/toggle", { method: "POST",
      body: { ids: [id], enabled: next } });
    if (el) {
      el.className = `badge ${next ? "st-online" : "st-unknown"}`;
      el.textContent = next ? "on" : "off";
      el.title = next ? "click to disable this file" : "click to enable this file";
      el.setAttribute("onclick",
        `event.stopPropagation();toggleLocalFile(${id}, ${next ? "true" : "false"}, this)`);
    }
    toast(next ? "file enabled" : "file disabled", "ok");
  } catch (e) { /* api() already toasted */ }
};

/* directory browser popup (stays inside the mounted media root) */
function browseDir(start, onPick) {
  const body = el("div");
  const pathLbl = el("div", { class: "mono small mb-2" });
  const list = el("div", { class: "border rounded p-1", style: "max-height:300px;overflow:auto" });
  const footer = el("div", { class: "d-flex gap-2" });
  let cur = start || "";
  const m = openModal({ title: "Select directory (inside mounted volume)", body, footer, size: "lg" });
  body.append(pathLbl, list);
  async function go(path) {
    const d = await api("/api/sources/local/browse?path=" + encodeURIComponent(path || ""));
    cur = d.path;
    pathLbl.textContent = d.path;
    list.innerHTML = "";
    const up = el("button", { class: "btn btn-sm btn-outline-secondary w-100 mb-1 text-start" }, "⬅ .. (up)");
    up.addEventListener("click", () => go(d.parent));
    list.append(up);
    for (const dir of d.dirs) {
      const b = el("button", { class: "btn btn-sm btn-light w-100 mb-1 text-start mono" }, "📁 " + dir.name);
      b.addEventListener("click", () => go(dir.path));
      list.append(b);
    }
    if (!d.dirs.length) list.append(el("div", { class: "small text-muted p-2" }, "no sub-directories"));
  }
  footer.append(mBtn("Cancel", "btn-outline-secondary", m.close),
    mBtn("Select this directory", "btn-accent", () => { onPick(cur); m.close(); }, "bi-check2"));
  go(cur);
}

/* ------------------------------------------------------------------ */
const TABS = {};
(async () => {
  await loadMeta();
  TABS.live = sourceTable("live", "#pane-live");
  TABS.vod = sourceTable("vod", "#pane-vod");
  TABS.series = sourceTable("series", "#pane-series");
  localTab("#pane-local");
  $$("#src-tabs .nav-link").forEach(a => a.addEventListener("click", (e) => {
    e.preventDefault();
    $$("#src-tabs .nav-link").forEach(x => x.classList.remove("active"));
    a.classList.add("active");
    for (const k of ["live", "vod", "series", "local"])
      $("#pane-" + k).classList.toggle("d-none", k !== a.dataset.tab);
    if (TABS[a.dataset.tab]) TABS[a.dataset.tab].reload();
  }));
})();
</script>
